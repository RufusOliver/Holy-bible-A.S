[package]
name = "holy-bible-a-s"
version = "1.0.0"
description = "Holy Bible A.S - Bible Audio Sync with 60+ translations, TTS, dictionaries, and accessibility"
authors = ["RufusOliver"]
license = "MIT"
repository = "https://github.com/RufusOliver/Holy-bible-A.S"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
