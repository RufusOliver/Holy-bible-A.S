// TTS Audiobook
const ttsPlayBtn = $('ttsPlayBtn');
const ttsStopBtn = $('ttsStopBtn');
const ttsSpeed = $('ttsSpeed');
const ttsSpeedVal = $('ttsSpeedVal');
const ttsVoiceSelect = $('ttsVoice');
const ttsStatusEl = $('ttsStatus');
let ttsRunning = false;
let ttsIdx = 0;

function langPrefixes(lang) {
  return lang === 'grc' ? ['grc', 'el'] : [lang];
}

const LS_SAVED_VOICE = 'kgnt_ttsVoice';
let voiceRetryTimer = null;

function offlineVoicePool(voices) {
  const onlineMarkers = /Google|Online|Network/i;
  const local = voices.filter(v => v.localService === true && !onlineMarkers.test(v.name));
  const noOnline = voices.filter(v => !onlineMarkers.test(v.name));
  return (local.length ? local : noOnline).length ? (local.length ? local : noOnline) : voices;
}

function getFilteredVoices() {
  const voices = speechSynthesis.getVoices();
  const langFilter = VERSIONS[versionSelect.value].lang;
  const prefixes = langPrefixes(langFilter);
  return offlineVoicePool(voices).filter(v => prefixes.some(p => v.lang.startsWith(p)));
}

function loadVoices() {
  const langFilter = VERSIONS[versionSelect.value].lang;
  const saved = safeGet(LS_SAVED_VOICE);
  if (!('speechSynthesis' in window)) {
    ttsVoiceSelect.innerHTML = '';
    if (langFilter === 'en') ttsVoiceSelect.add(new Option('Flite (offline, no AI)', 'flite'));
    ttsStatusEl.textContent = langFilter === 'en'
      ? 'No system voices; select Flite for offline reading.'
      : 'No text-to-speech voices available on this device.';
    return;
  }
  const voices = speechSynthesis.getVoices();
  ttsVoiceSelect.innerHTML = '';
  if (langFilter === 'en') ttsVoiceSelect.add(new Option('Flite (offline, no AI)', 'flite'));
  if (!voices.length) {
    clearTimeout(voiceRetryTimer);
    voiceRetryTimer = setTimeout(loadVoices, 300);
    return;
  }
  const pool = offlineVoicePool(voices);
  const filtered = getFilteredVoices();
  filtered.forEach((v, i) => {
    const opt = new Option(`${v.name} (${v.lang})`, i);
    if (v.lang.startsWith(langFilter)) opt.selected = true;
    ttsVoiceSelect.appendChild(opt);
  });
  if (saved === 'flite') {
    ttsVoiceSelect.value = 'flite';
  } else if (filtered.length) {
    if (saved !== null && filtered[saved]) {
      ttsVoiceSelect.value = saved;
    } else {
      ttsVoiceSelect.value = '0';
    }
  } else {
    const any = pool.length ? pool[0] : null;
    if (any) {
      ttsVoiceSelect.add(new Option(`Auto (${any.name}, ${any.lang})`, ''));
      ttsVoiceSelect.value = '';
      ttsStatusEl.textContent = 'No matching voice for this language; using system default.';
    }
  }
}
if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
ttsVoiceSelect.onchange = () => {
  const v = Number(ttsVoiceSelect.value);
  if (ttsVoiceSelect.value === 'flite') safeSet(LS_SAVED_VOICE, 'flite');
  else if (Number.isInteger(v) && v >= 0) safeSet(LS_SAVED_VOICE, String(v));
};

function fliteSelected() {
  return ttsVoiceSelect.value === 'flite';
}

// Flite (festvox/flite) offline WASM synthesis via Web Audio.
let fliteMod = null;
let fliteProm = null;
let fliteCtx = null;
let fliteGain = null;
let fliteNode = null;

function fliteAudioCtx() {
  if (!fliteCtx) {
    fliteCtx = new (window.AudioContext || window.webkitAudioContext)();
    fliteGain = fliteCtx.createGain();
    fliteGain.connect(fliteCtx.destination);
  }
  if (fliteCtx.state === 'suspended') fliteCtx.resume();
  return fliteCtx;
}

function fliteModuleLoad() {
  if (fliteMod) return Promise.resolve(fliteMod);
  if (!fliteProm) {
    if (!window.FliteModule) return Promise.reject(new Error('Flite audio engine not available.'));
    fliteProm = FliteModule({ locateFile: (p) => 'data/flite/' + p })
      .then((m) => {
        if (m && m._flite_wasm_init()) { fliteMod = m; return m; }
        throw new Error('Flite init failed');
      })
      .catch((e) => {
        fliteProm = null;
        throw new Error('Flite audio engine failed to load. Serve this page over HTTP to use offline TTS.');
      });
  }
  return fliteProm;
}

function fliteSynthVerse(text, voice, cb) {
  fliteModuleLoad().then((m) => {
    let lenP, rateP, txtP;
    let data = null;
    try {
      lenP = m._malloc(4); rateP = m._malloc(4);
      const bytes = m.lengthBytesUTF8(text) + 2;
      txtP = m._malloc(bytes);
      m.stringToUTF8(text, txtP, bytes);
      const sampP = m._flite_wasm_synth(txtP, voice, lenP, rateP);
      const len = m.HEAP32[lenP >> 2];
      const rate = m.HEAP32[rateP >> 2];
      m._free(txtP); m._free(lenP); m._free(rateP);
      if (!sampP || len <= 0 || rate <= 0) {
        if (sampP) m._free(sampP);
        throw new Error('Flite produced no audio');
      }
      data = { samples: m.HEAP16.subarray(sampP >> 1, (sampP >> 1) + len).slice(), rate };
      m._free(sampP);
    } catch (e) {
      if (txtP) m._free(txtP);
      if (lenP) m._free(lenP);
      if (rateP) m._free(rateP);
      cb(e);
      return;
    }
    cb(null, data);
  }).catch((e) => cb(e));
}

function fliteSpeakVerse() {
  if (!ttsRunning) return;
  const text = verses[ttsIdx] || '';
  if (!text) { ttsIdx++; ttsSpeak(); return; }
  fliteSynthVerse(text, 1, (err, res) => {
    if (!ttsRunning) return;
    if (err) {
      ttsStatusEl.textContent = 'Flite error: ' + err.message;
      ttsStop();
      return;
    }
    let ctx;
    try { ctx = fliteAudioCtx(); } catch (e) { ttsStop(); return; }
    clearWordHighlights();
    const n = res.samples.length;
    const f32 = new Float32Array(n);
    for (let i = 0; i < n; i++) f32[i] = res.samples[i] / 32768;
    const buf = ctx.createBuffer(1, n, res.rate);
    buf.copyToChannel(f32, 0);
    fliteNode = ctx.createBufferSource();
    fliteNode.buffer = buf;
    fliteGain.gain.value = parseFloat(volumeSlider.value) || 1;
    fliteNode.connect(fliteGain);
    highlightVerse(ttsIdx);
    ttsStatusEl.textContent = `Verse ${ttsIdx + 1} (Flite)...`;
    fliteNode.onended = () => { if (ttsRunning) { ttsIdx++; ttsSpeak(); } };
    fliteNode.start();
  });
}

function fliteStopPlayback() {
  if (fliteNode) { try { fliteNode.stop(); } catch (e) {} fliteNode = null; }
}

function fliteSetVolume(v) {
  if (fliteGain && fliteCtx) fliteGain.gain.value = parseFloat(v) || 1;
}

ttsSpeed.oninput = () => { ttsSpeedVal.textContent = ttsSpeed.value + 'x'; };

ttsPlayBtn.onclick = () => {
  if (verses.length === 0) { ttsStatusEl.textContent = 'Load a chapter first.'; return; }
  if (ttsRunning) { ttsPause(); return; }
  speechSynthesis.cancel();
  fliteStopPlayback();
  ttsRunning = true;
  ttsIdx = currentVerseIndex >= 0 ? currentVerseIndex : 0;
  ttsPlayBtn.style.display = 'none';
  ttsStopBtn.classList.add('visible');
  ttsSpeak();
};

ttsStopBtn.onclick = () => { ttsStop(); };

function ttsPause() {
  if (fliteSelected() && fliteCtx) {
    if (fliteCtx.state === 'suspended') {
      fliteCtx.resume();
      ttsStatusEl.textContent = `Verse ${ttsIdx + 1}...`;
    } else if (fliteCtx.state === 'running') {
      fliteCtx.suspend();
      ttsStatusEl.textContent = 'Paused.';
    }
    return;
  }
  if (speechSynthesis.paused) {
    speechSynthesis.resume();
    ttsStatusEl.textContent = `Verse ${ttsIdx + 1}...`;
  } else if (speechSynthesis.speaking) {
    speechSynthesis.pause();
    ttsStatusEl.textContent = 'Paused.';
  }
}

function ttsStop() {
  speechSynthesis.cancel();
  fliteStopPlayback();
  ttsRunning = false;
  clearWordHighlights();
  ttsPlayBtn.style.display = '';
  ttsStopBtn.classList.remove('visible');
  ttsStatusEl.textContent = 'Stopped.';
}

function clearWordHighlights() {
  document.querySelectorAll('.w.wa').forEach(el => el.classList.remove('wa'));
}

function charIndexToWordIndex(charIdx, tokens) {
  let pos = 0;
  let wordIdx = 0;
  for (let i = 0; i < tokens.length; i++) {
    if (tokens[i].match(/^\s+$/)) { pos += tokens[i].length; continue; }
    const start = pos;
    pos += tokens[i].length;
    if (charIdx >= start && charIdx < pos) return wordIdx;
    wordIdx++;
  }
  return wordIdx;
}

function autoAdvanceChapter() {
  const bookList = getBookList();
  const maxCh = bookList[currentBook] || 0;

  if (currentChapter < maxCh) {
    currentChapter++;
  } else {
    const books = Object.keys(bookList);
    const idx = books.indexOf(currentBook);
    if (idx < 0 || idx >= books.length - 1) {
      if ($('loopWhole').checked) {
        currentBook = books[0];
        currentChapter = 1;
      } else if ($('loopNT').checked) {
        const nt = firstNTBook();
        if (nt && bookList[nt]) {
          currentBook = nt;
          currentChapter = 1;
        } else {
          ttsStatusEl.textContent = 'No repeat. End of Bible.';
          setTimeout(ttsStop, 1500);
          return;
        }
      } else {
        ttsStatusEl.textContent = 'End of Bible.';
        setTimeout(ttsStop, 1500);
        return;
      }
    } else if ($('loopPaul').checked) {
      const lastPaul = lastPaulBook();
      const firstPaul = firstPaulBook();
      if (currentBook === lastPaul && firstPaul && bookList[firstPaul]) {
        currentBook = firstPaul;
        currentChapter = 1;
      } else {
        currentBook = books[idx + 1];
        currentChapter = 1;
      }
    } else if ($('loopOT').checked) {
      const nextBook = books[idx + 1];
      const firstNT = firstNTBook();
      if (firstNT && nextBook === firstNT) {
        currentBook = books[0];
        currentChapter = 1;
      } else {
        currentBook = nextBook;
        currentChapter = 1;
      }
    } else {
      currentBook = books[idx + 1];
      currentChapter = 1;
    }
  }

  bookSelect.value = currentBook;
  populateChapters();
  chapterSelect.value = currentChapter;
  ttsStatusEl.textContent = 'Load next chapter...';
  loadChapter().then(() => {
    if (!ttsRunning || verses.length === 0) return;
    ttsIdx = 0;
    ttsSpeak();
  }).catch(() => {
    ttsStatusEl.textContent = 'Cannot load next chapter.';
    ttsStop();
  });
}

function firstNTBook() {
  const v = versionSelect.value;
  if (v === 'LXX' || v === 'Apocrypha') return null;
  if (v === 'Arabic') return Object.keys(AR_BOOKS)[39]; // Matthew in Arabic
  return 'Matthew';
}

const PAUL_BOOK_ENGLISH = ['Romans', '1 Corinthians', '2 Corinthians', 'Galatians', 'Ephesians', 'Philippians', 'Colossians', '1 Thessalonians', '2 Thessalonians', '1 Timothy', '2 Timothy', 'Titus', 'Philemon'];

function firstPaulBook() {
  const v = versionSelect.value;
  if (v === 'LXX' || v === 'Apocrypha') return null;
  if (v === 'Arabic') return AR_ENGLISH_TO_ARABIC['Romans'] || null;
  return 'Romans';
}

function lastPaulBook() {
  const v = versionSelect.value;
  if (v === 'LXX' || v === 'Apocrypha') return null;
  if (v === 'Arabic') return AR_ENGLISH_TO_ARABIC['Philemon'] || null;
  return 'Philemon';
}

function ttsSpeak() {
  if (!ttsRunning) return;
  if (ttsIdx >= verses.length) {
    autoAdvanceChapter();
    return;
  }
  if (fliteSelected()) { fliteSpeakVerse(); return; }
  clearWordHighlights();
  const verseText = verses[ttsIdx];
  const tokens = verseText.split(/(\s+)/);
  const wordTokens = tokens.filter(t => !t.match(/^\s+$/));
  const verseEl = document.querySelector(`.verse[data-index="${ttsIdx}"]`);
  const wordEls = verseEl ? verseEl.querySelectorAll('.w') : [];

  const utter = new SpeechSynthesisUtterance(verseText);
  const filteredVoices = getFilteredVoices();
  const selIdx = parseInt(ttsVoiceSelect.value) || 0;
  if (filteredVoices[selIdx]) {
    utter.voice = filteredVoices[selIdx];
    utter.lang = filteredVoices[selIdx].lang;
  }
  utter.rate = parseFloat(ttsSpeed.value);
  utter.volume = parseFloat(volumeSlider.value);
  highlightVerse(ttsIdx);
  ttsStatusEl.textContent = `Verse ${ttsIdx + 1}...`;

  utter.onboundary = (e) => {
    if (e.name === 'word') {
      const wi = charIndexToWordIndex(e.charIndex, tokens);
      clearWordHighlights();
      if (wordEls[wi]) {
        wordEls[wi].classList.add('wa');
        if (!userScrolledAway) {
          programmaticScroll = true;
          wordEls[wi].scrollIntoView({ behavior: 'smooth', block: 'center' });
          scheduleProgrammaticScrollEnd();
        }
      }
    }
  };

  utter.onend = () => {
    clearWordHighlights();
    if (!ttsRunning) return;
    ttsIdx++;
    ttsSpeak();
  };
  utter.onerror = (e) => {
    clearWordHighlights();
    if (e.error !== 'canceled') {
      ttsStatusEl.textContent = `Speech error: ${e.error}`;
      ttsStop();
    }
  };
  speechSynthesis.speak(utter);
}

// Keyboard shortcuts for TTS and accessibility
document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    if (kjvOverlay.classList.contains('open')) { e.preventDefault(); kjvOverlayClose(); return; }
    if (dictOverlay.classList.contains('open')) { e.preventDefault(); dictClose(); return; }
    if (helpOverlay.classList.contains('open')) { e.preventDefault(); helpOverlay.classList.remove('open'); return; }
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); if (ttsRunning) ttsPause(); else togglePlayPause(); }
  if (e.code === 'KeyT') { e.preventDefault(); if (!ttsRunning) ttsPlayBtn.click(); else ttsStop(); }
  if (e.code === 'KeyD' && e.altKey) { e.preventDefault(); toggleDyslexia(); }
  if (e.code === 'ArrowLeft') { seekBar.value = Math.max(0, (audio.currentTime - 3) / (audio.duration || 1)); seekBar.oninput(); }
  if (e.code === 'ArrowRight') { seekBar.value = Math.min(1, (audio.currentTime + 3) / (audio.duration || 1)); seekBar.oninput(); }
});

function formatTime(t) {
  if (t == null || isNaN(t)) return '0:00';
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Load default (or resume last saved position)
(async function initApp() {
  try {
    await tryAutoReconnect();
    applyResumedState();
    await loadChapter();
    if (resumeVerseIndex >= 0 && resumeVerseIndex < verses.length) {
      currentVerseIndex = resumeVerseIndex;
      highlightVerse(currentVerseIndex);
      statusEl.textContent = `Resumed at verse ${resumeVerseIndex + 1}. Load an audio file to sync playback.`;
    }
  } catch (err) {
    console.error('App initialization failed:', err);
    statusEl.textContent = 'Failed to initialize: ' + (err.message || err);
  }
})();
</script>
