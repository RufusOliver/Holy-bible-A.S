<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holy Bible A.S</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='26' y='4' width='12' height='56' rx='2' fill='%23ffffff'/><rect x='12' y='16' width='40' height='12' rx='2' fill='%23ffffff'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a1f0a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; overflow: auto; }
body.rtl { direction: rtl; text-align: right; }
body.rtl header { flex-direction: row-reverse; }
body.rtl .controls { flex-direction: row-reverse; justify-content: flex-start; }
body.rtl .verse .num { margin-right: 0; margin-left: 6px; }
body.rtl .verse.active { border-left: none; border-right: 3px solid #ffc107; }
body.rtl .verse-info { text-align: left; }
body.rtl .audio-bar { flex-direction: row-reverse; }
body.rtl select, body.rtl button { font-family: 'Segoe UI', 'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', 'Sakkal Majalla', sans-serif; }
header { background: #0d2a0d; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #1a5c2a; }
header h1 { color: #fff; font-size: 1.4rem; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.controls select, .controls button, .controls input[type="file"] { padding: 6px 12px; border: 1px solid #1a5c2a; border-radius: 4px; background: #0a1f0a; color: #ffffff; font-size: 0.9rem; }
#versionSelect { min-width: 160px; background: #1a5c2a; color: #4caf50; font-weight: 600; }
.controls select:focus, .controls button:focus { outline: 2px solid #4caf50; }
.controls button { cursor: pointer; background: #1a5c2a; transition: background 0.2s; }
.controls button:hover { background: #4caf50; }
.controls button.active { background: #4caf50; }
.controls label { font-size: 0.85rem; color: #8fbc8f; display: flex; align-items: center; gap: 5px; cursor: pointer; }
.controls input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
.audio-bar { background: #0d2a0d; padding: 8px 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid #1a5c2a; }
.audio-bar .time { font-size: 0.85rem; color: #8fbc8f; min-width: 100px; }
#seekBar { flex: 1; min-width: 100px; accent-color: #4caf50; }
#volumeSlider { width: 90px; accent-color: #4caf50; }
.audio-bar .volume-wrap { display: flex; align-items: center; gap: 5px; }
.audio-bar .volume-wrap input { width: 80px; }
.vol-pct { font-size: 0.8rem; color: #8fbc8f; min-width: 30px; }
.verse-info { font-size: 0.85rem; color: #d4ff00; min-width: 80px; text-align: right; }
#chapter-title { background: #1a5c2a; padding: 6px 15px; font-size: 1rem; font-weight: 600; color: #fff; text-align: center; letter-spacing: 0.5px; }
#verses-container { flex: 1; overflow: visible; padding: 15px 20px 40px 20px; max-width: 800px; margin: 0 auto; width: 100%; }
.verse { padding: 4px 10px; margin: 1px 0; border-radius: 3px; transition: background 0.3s, color 0.3s; cursor: pointer; line-height: 1.6; font-size: 1.05rem; font-family: 'Segoe UI', 'Noto Sans', 'Noto Naskh Arabic', 'Geeza Pro', 'Traditional Arabic', 'SBL Greek', 'Gentium Plus', 'Galatia SIL', 'Palatino Linotype', serif; }
.verse:hover { background: rgba(255, 235, 59, 0.15); }
.verse .num { color: #4caf50; font-weight: 700; margin-right: 6px; font-size: 0.75rem; }
.verse.active { background: linear-gradient(135deg, rgba(255,235,59,0.25), rgba(255,193,7,0.4)); border-left: 3px solid #ffc107; color: #fff; }
.verse.active .num { color: #fff9c4; }
.w { display: inline-block; transition: background 0.15s, color 0.15s; border-radius: 2px; padding: 0 1px; }
.w[data-sn] { cursor: pointer; }
.w[data-sn]:hover { background: rgba(76, 175, 80, 0.18); }
.dict-overlay { position: fixed; inset: 0; background: rgba(10, 10, 20, 0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
.dict-overlay.open { display: flex; }
.dict-box { background: #0d2a0d; border: 1px solid #1a5c2a; border-radius: 8px; width: 100%; max-width: 620px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 12px 45px rgba(0,0,0,0.6); }
.dict-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #1a5c2a; }
.dict-title { color: #4caf50; font-weight: 600; font-size: 0.95rem; }
.dict-close { background: none; border: none; color: #8fbc8f; font-size: 1.15rem; cursor: pointer; padding: 2px 8px; line-height: 1; }
.dict-close:hover { color: #4caf50; }
.dict-body { padding: 14px 16px 18px; overflow-y: auto; }
.dict-entry + .dict-entry { margin-top: 14px; padding-top: 14px; border-top: 1px dashed #1a5c2a; }
.dict-lemma { font-size: 1.45rem; color: #fff; line-height: 1.3; }
.dict-translit { font-size: 1rem; color: #81c784; font-style: italic; font-family: 'Segoe UI', sans-serif; }
.dict-num { color: #7a9a7a; font-size: 0.78rem; font-family: monospace; margin-bottom: 2px; }
.dict-def { margin-top: 8px; color: #ffffff; line-height: 1.55; }
.dict-deriv { margin-top: 6px; color: #7a9a7a; font-size: 0.85rem; line-height: 1.5; }
.dict-kjv { margin-top: 8px; color: #81c784; font-size: 0.9rem; line-height: 1.5; }
.dict-kjv-label { color: #4caf50; font-weight: 600; }
.dict-tabs { display: flex; gap: 0; border-bottom: 1px solid #1a5c2a; padding: 0 16px; background: #0a1f0a; overflow-x: auto; scrollbar-width: none; }
.dict-tabs::-webkit-scrollbar { display: none; }
.dict-tab { padding: 8px 10px; font-size: 0.75rem; color: #6a8a6a; cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
.dict-tab:hover { color: #8fbc8f; }
.dict-tab.active { color: #4caf50; border-bottom-color: #4caf50; font-weight: 600; }
.dict-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px 2px; }
.dict-chip { font-size: 0.7rem; padding: 3px 9px; border-radius: 11px; border: 1px solid #1a5c2a; background: #0a1f0a; color: #8fbc8f; cursor: pointer; font-family: inherit; }
.dict-chip:hover { background: #123a12; }
.dict-chip.active { background: #1a5c2a; color: #4caf50; font-weight: 600; border-color: #4caf50; }
.dict-section-label { color: #4caf50; font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
.dict-section-label:first-child { margin-top: 0; }
.dict-topical { margin-top: 6px; color: #c8e6c9; line-height: 1.55; font-size: 0.92rem; white-space: pre-wrap; }
.kjv-dict-kbd { color: #c8e6c9; font-size: 0.7rem; font-style: italic; margin-top: 10px; }
.kjv-dict-word { color: #ffc107; font-weight: 600; }
.w[data-kjv] { cursor: pointer; text-decoration: underline dotted #4caf50; text-underline-offset: 2px; }
.w[data-kjv]:hover { background: rgba(76, 175, 80, 0.18); }
.w[data-kjv].wa { background: #4caf50; color: #fff; }
.help-overlay { position: fixed; inset: 0; background: rgba(10, 10, 20, 0.75); display: none; align-items: center; justify-content: center; z-index: 2100; padding: 16px; }
.help-overlay.open { display: flex; }
.help-box { background: #0d2a0d; border: 1px solid #1a5c2a; border-radius: 8px; width: 100%; max-width: 460px; box-shadow: 0 12px 45px rgba(0,0,0,0.6); }
.help-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #1a5c2a; }
.help-head span { color: #4caf50; font-weight: 600; font-size: 0.95rem; }
.help-body { padding: 16px 18px; }
.help-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid #112a11; }
.help-row:last-child { border-bottom: none; }
.help-key { background: #1a5c2a; color: #fff; font-family: monospace; font-size: 0.82rem; padding: 3px 10px; border-radius: 4px; min-width: 90px; text-align: center; white-space: nowrap; font-weight: 600; }
.help-desc { color: #c8e6c9; font-size: 0.88rem; }
.help-note { margin-top: 12px; color: #6a8a6a; font-size: 0.8rem; font-style: italic; line-height: 1.5; }
#helpBtn { font-weight: 700; font-size: 1rem; }
.dict-none { color: #7a9a7a; font-style: italic; }
.parallel-bar { background: #1a5c2a; padding: 6px 15px; display: none; align-items: center; gap: 10px; flex-wrap: wrap; }
.parallel-bar select { padding: 4px 8px; border: 1px solid #1a5c2a; border-radius: 4px; background: #0a1f0a; color: #ffffff; font-size: 0.85rem; }
.parallel-label { color: #4caf50; font-weight: 600; font-size: 0.85rem; }
.parallel-hint { color: #6a8a6a; font-size: 0.78rem; font-style: italic; }
.parallel #verses-container { max-width: 1600px; display: flex; gap: 14px; align-items: flex-start; }
.parallel #verses-container .pane { flex: 1 1 0; min-width: 0; }
.parallel #verses-container .pane + .pane { border-left: 1px solid #1a5c2a; padding-left: 14px; }
.pane-title { font-size: 0.82rem; color: #4caf50; font-weight: 700; margin-bottom: 8px; text-align: center; letter-spacing: 0.5px; }
.w.wa { background: #4caf50; color: #fff; }
.w .sn { display: block; font-size: 0.55em; color: #7a9a7a; line-height: 1; margin-bottom: 1px; font-family: 'Segoe UI', sans-serif; text-align: center; }
.w.wa .sn { color: #c8e6c9; }
.w .en { display: block; font-size: 0.55em; color: #81c784; line-height: 1; margin-top: 1px; font-family: 'Segoe UI', sans-serif; text-align: center; }
.w .en.kjv { color: #ffc107; font-size: 0.6em; line-height: 1.15; margin-top: 2px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: min(140px, 30vw); }
.w.wa .en { color: #c8e6c9; }
.timestamp-badge { float: right; font-size: 0.65rem; color: #3a5a3a; margin-left: 8px; font-family: monospace; }
#status { padding: 4px 12px; font-size: 0.8rem; color: #6a8a6a; text-align: center; }
.timestamp-mode #verses-container .verse { border: 1px dashed #2a4a2a; margin: 4px 0; }
.hint { color: #4a6a4a; font-style: italic; font-size: 0.85rem; padding: 4px 12px; text-align: center; }
.tts-bar { background: #1a5c2a; padding: 8px 15px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #4caf50; }
.tts-btn { padding: 8px 18px; border: none; border-radius: 5px; background: #4caf50; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
.tts-btn:hover { background: #388e3c; }
.tts-btn.tts-stop { background: #3a5a3a; }
.tts-btn.tts-stop:hover { background: #2a4a2a; }
.tts-btn.tts-stop { display: none; }
.tts-btn.tts-stop.visible { display: inline-block; }
.tts-label { color: #8fbc8f; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
.tts-label input[type="range"] { width: 70px; accent-color: #4caf50; }
.tts-status { color: #4caf50; font-size: 0.85rem; }
#ttsVoice { padding: 4px 8px; border: 1px solid #1a5c2a; border-radius: 4px; background: #0a1f0a; color: #ffffff; font-size: 0.8rem; max-width: 200px; }
#ttsVoice option { background: #0a1f0a; color: #ffffff; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0a1f0a; }
::-webkit-scrollbar-thumb { background: #1a5c2a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #4caf50; }

/* Dyslexia Mode */
.dyslexia-bar { background: #1a1a2e; padding: 8px 15px; display: none; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 2px solid #f0c040; }
.dyslexia-bar.visible { display: flex; }
.dyslexia-label { color: #f0c040; font-size: 0.8rem; font-weight: 600; }
.dyslexia-ctrl { display: flex; align-items: center; gap: 4px; }
.dyslexia-ctrl label { color: #a0a0c0; font-size: 0.75rem; }
.dyslexia-ctrl input[type="range"] { width: 80px; accent-color: #f0c040; }
.dyslexia-ctrl select { padding: 3px 6px; border: 1px solid #333; border-radius: 4px; background: #0d0d1a; color: #fff; font-size: 0.75rem; }
.dyslexia-ctrl button { padding: 4px 10px; border: 1px solid #f0c040; border-radius: 4px; background: transparent; color: #f0c040; font-size: 0.75rem; cursor: pointer; transition: background 0.2s; }
.dyslexia-ctrl button:hover { background: rgba(240,192,64,0.15); }
.dyslexia-ctrl button.active { background: #f0c040; color: #0d0d1a; font-weight: 600; }
.reading-ruler { position: fixed; left: 0; right: 0; height: 50px; pointer-events: none; z-index: 500; display: none; }
.reading-ruler.visible { display: block; }
.reading-ruler-line { position: absolute; left: 0; right: 0; height: 50px; background: linear-gradient(to bottom, rgba(240,192,64,0.08) 0%, rgba(240,192,64,0.18) 50%, rgba(240,192,64,0.08) 100%); border-top: 2px solid rgba(240,192,64,0.3); border-bottom: 2px solid rgba(240,192,64,0.3); transition: top 0.15s ease-out; }

body.dyslexia { font-family: 'OpenDyslexicRegular', 'OpenDyslexic', 'Comic Sans MS', cursive, sans-serif; letter-spacing: 0.05em; word-spacing: 0.1em; }
body.dyslexia .verse { line-height: var(--dys-line-height, 2.2); font-size: var(--dys-font-size, 1.15em); }
body.dyslexia .verse .w { padding: 2px 0; }
body.dyslexia .verse .w .sn { font-size: 0.6em; }
body.dyslexia .verse .w .en { font-size: 0.6em; }
body.dyslexia-bg-cream { background: #fdf6e3 !important; color: #333 !important; }
body.dyslexia-bg-sepia { background: #f5e6c8 !important; color: #3b2e1a !important; }
body.dyslexia-bg-blue { background: #e8f0fe !important; color: #1a1a2e !important; }
body.dyslexia-bg-green { background: #e6f5e6 !important; color: #1a2e1a !important; }
body.dyslexia-bg-pink { background: #fce4ec !important; color: #2e1a2a !important; }
body.dyslexia-bg-dark { background: #1a1a2e !important; color: #e0e0e0 !important; }
body.dyslexia-bg-cream .dict-overlay { background: rgba(253,246,227,0.95); }
body.dyslexia-bg-sepia .dict-overlay { background: rgba(245,230,200,0.95); }
body.dyslexia-bg-blue .dict-overlay { background: rgba(232,240,254,0.95); }
body.dyslexia-bg-green .dict-overlay { background: rgba(230,245,230,0.95); }
body.dyslexia-bg-pink .dict-overlay { background: rgba(252,228,236,0.95); }
body.dyslexia-bg-dark .dict-overlay { background: rgba(26,26,46,0.95); }
body.dyslexia .verse:hover { background: rgba(240,192,64,0.2) !important; }
body.dyslexia .verse.active { background: linear-gradient(135deg, rgba(240,192,64,0.3), rgba(240,160,40,0.45)) !important; border-left-color: #f0c040 !important; }
body.dyslexia-bg-cream .verse, body.dyslexia-bg-sepia .verse, body.dyslexia-bg-blue .verse, body.dyslexia-bg-green .verse, body.dyslexia-bg-pink .verse { border-bottom: 1px solid rgba(0,0,0,0.08); }
</style>
</head>
<body>

<header>
  <h1>&#x271D; Holy Bible A.S</h1>
  <div class="controls">
    <select id="versionSelect" aria-label="Select Bible version"></select>
    <select id="bookSelect" aria-label="Select book"></select>
    <select id="chapterSelect" aria-label="Select chapter"></select>
    <button id="loadBtn">Load Chapter</button>
    <label><input type="checkbox" id="autoScroll" checked> Auto-Scroll</label>
    <label><input type="checkbox" id="showStrongs"> Interlinear</label>
    <label><input type="checkbox" id="parallelCb"> Parallel</label>
    <label><input type="checkbox" id="timestampMode"> Set Timestamps</label>
    <button id="resetTimestampsBtn">Reset Timestamps</button>
    <button id="storageBtn" title="Save app data to a folder on disk (bookmarks, timestamps, position). Falls back to browser storage otherwise.">Storage: Browser</button>
    <button id="bookmarkBtn" title="Save current spot as a bookmark">&#128278; Bookmark</button>
    <select id="bookmarkSelect" aria-label="Jump to bookmark"><option value="">Bookmarks&hellip;</option></select>
    <button id="deleteBookmarkBtn" title="Delete selected bookmark">&#128465;</button>
    <button id="exportBookmarksBtn" title="Export bookmarks as JSON file">&#128190; Export</button>
    <button id="inspireBtn" title="Pick a random verse">&#10024; Inspire Me</button>
    <button id="dyslexiaBtn" title="Toggle Dyslexia-friendly mode" style="font-weight:700;font-size:1rem;">Dy</button>
    <button id="updateBtn" title="Check for the latest Linux AppImage">&#8595; Update</button>
    <button id="helpBtn" title="Keyboard shortcuts and help">? Help</button>
  </div>
</header>

<div id="parallelBar" class="parallel-bar">
  <span class="parallel-label">3-Way Reading</span>
  <select id="par2Sel" aria-label="Second pane version"></select>
  <select id="par3Sel" aria-label="Third pane version"></select>
  <span class="parallel-hint">Pane 1 uses the main version dropdown above.</span>
</div>

<div class="audio-bar">
  <button id="playBtn">&#9654;</button>
  <input type="range" id="seekBar" min="0" max="1" step="0.001" value="0" aria-label="Seek audio position">
  <span class="time" id="timeDisplay">0:00 / 0:00</span>
  <div class="volume-wrap">
    <span id="volIcon">&#128266;</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3" aria-label="Adjust volume">
    <span id="volPct" class="vol-pct">30%</span>
  </div>
  <span class="verse-info" id="currentVerseInfo">--</span>
  <input type="file" id="audioFileInput" accept="audio/*" aria-label="Select an audio file">
</div>

<div class="tts-bar">
  <button id="ttsPlayBtn" class="tts-btn">&#127911; Audiobook</button>
  <button id="ttsStopBtn" class="tts-btn tts-stop">&#9632; Stop</button>
  <label class="tts-label">Speed
    <input type="range" id="ttsSpeed" min="0.5" max="2" step="0.1" value="1">
    <span id="ttsSpeedVal">1x</span>
  </label>
  <select id="ttsVoice" aria-label="Select TTS voice"></select>
<label class="tts-label"><input type="checkbox" id="loopNT"> Repeat New Testament</label>
  <label class="tts-label"><input type="checkbox" id="loopOT"> Repeat Old Testament</label>
  <label class="tts-label"><input type="checkbox" id="loopWhole"> Repeat Whole Bible</label>
  <label class="tts-label"><input type="checkbox" id="loopPaul"> Repeat Paul's Letters</label>
  <span id="ttsStatus" class="tts-status"></span>
</div>

<div id="dyslexiaBar" class="dyslexia-bar">
  <span class="dyslexia-label">Dyslexia Mode</span>
  <div class="dyslexia-ctrl">
    <label>Size</label>
    <input type="range" id="dysFontSize" min="0.8" max="2" step="0.05" value="1.15" title="Font size">
    <span id="dysFontSizeVal">1.15x</span>
  </div>
  <div class="dyslexia-ctrl">
    <label>Spacing</label>
    <input type="range" id="dysLetterSpacing" min="0" max="0.2" step="0.01" value="0.05" title="Letter spacing">
    <span id="dysLetterSpacingVal">0.05</span>
  </div>
  <div class="dyslexia-ctrl">
    <label>Lines</label>
    <input type="range" id="dysLineHeight" min="1.5" max="4" step="0.1" value="2.2" title="Line height">
    <span id="dysLineHeightVal">2.2</span>
  </div>
  <div class="dyslexia-ctrl">
    <label>Background</label>
    <select id="dysBg" title="Background color">
      <option value="">Dark</option>
      <option value="cream">Cream</option>
      <option value="sepia">Sepia</option>
      <option value="blue">Light Blue</option>
      <option value="green">Light Green</option>
      <option value="pink">Pink</option>
      <option value="dark">Dark Blue</option>
    </select>
  </div>
  <div class="dyslexia-ctrl">
    <button id="dysRulerBtn" title="Toggle reading ruler guide">Ruler</button>
  </div>
  <div class="dyslexia-ctrl">
    <button id="dysResetBtn" title="Reset to defaults">Reset</button>
  </div>
</div>

<div id="readingRuler" class="reading-ruler"><div class="reading-ruler-line"></div></div>

<div id="chapter-title">Select a chapter to begin</div>
<div id="status">Select a chapter to load Bible text.</div>
<div id="verses-container"></div>

<script src="data/sblgnt.js"></script>
<script src="data/strongs.js"></script>
<script src="data/lexicon.js"></script>
<script src="data/interlinear.js"></script>
<script src="data/kjvdict.js"></script>
<script src="data/flite/flite.js"></script>
<script>
const NT_BOOKS = {
  "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21,
  "Acts": 28,
  "Romans": 16, "1 Corinthians": 16, "2 Corinthians": 13,
  "Galatians": 6, "Ephesians": 6, "Philippians": 4, "Colossians": 4,
  "1 Thessalonians": 5, "2 Thessalonians": 3,
  "1 Timothy": 6, "2 Timothy": 4, "Titus": 3, "Philemon": 1,
  "Hebrews": 13, "James": 5,
  "1 Peter": 5, "2 Peter": 3,
  "1 John": 5, "2 John": 1, "3 John": 1, "Jude": 1,

  if (v === 'Apocrypha') return APOC_BOOKS;
  if (v === 'WLCa' || v === 'WLC' || v === 'WLCC' || v === 'HAC') return OT_BOOKS;
  if (v === 'DHNT') return NT_BOOKS;
  if (v === 'TR' || v === 'NTGT') return NT_BOOKS;
  if (v === 'ain_ABT') { const m = {}; Object.assign(m, {'Psalms': 150}, NT_BOOKS); return m; }
  const all = {};
  Object.assign(all, OT_BOOKS, NT_BOOKS);
  return all;
}

// AR_BOOKS is ordered OT-then-NT, so index 39 is Matthew; map English names.
const AR_ENGLISH_TO_ARABIC = (() => {
  const map = {};
  const arKeys = Object.keys(AR_BOOKS);
  Object.keys(OT_BOOKS).forEach((b, i) => { map[b] = arKeys[i]; });
  Object.keys(NT_BOOKS).forEach((b, i) => { map[b] = arKeys[39 + i]; });
  return map;
})();

function bookNameForVersion(version, book) {
  if (version === 'Arabic') return AR_ENGLISH_TO_ARABIC[book] || book;
  return book;
}

const BROKEN_DATA_VERSIONS = new Set([
  'Byzantine', 'Orthodox', 'ScrivenerTR', 'StephanusTR', 'Tischendorf', 'WH', 'LXX',
  'Apocrypha'
]);
const VERSIONS = Object.fromEntries(
  Object.entries(ALL_VERSIONS).filter(([key]) => !BROKEN_DATA_VERSIONS.has(key))
);

const bookCache = {};

function loadVersionDataFromVar(varName) {
  const data = window[varName];
  if (!data) return null;
  return JSON.parse(JSON.stringify(data));
}

const _dataFileCache = {};
function ensureVersionData(version) {
  const cfg = VERSIONS[version];
  if (!cfg) return Promise.resolve(false);
  if (window[cfg.localVar]) return Promise.resolve(true);
  if (_dataFileCache[cfg.localVar]) return _dataFileCache[cfg.localVar];
  const p = new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'data/' + cfg.file;
    s.onload = () => resolve(!!window[cfg.localVar]);
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  _dataFileCache[cfg.localVar] = p;
  return p;
}

function extractBook(data, book) {
  const chs = data[book];
  if (!chs) return null;
  const verseMap = {};
  Object.keys(chs).forEach(ch => {
    Object.keys(chs[ch]).forEach(vs => {
      verseMap[ch + ':' + vs] = chs[ch][vs];
    });
  });
  return verseMap;
}

async function fetchBookData(version, book) {
  const cfg = VERSIONS[version];
  if (!bookCache[version]) bookCache[version] = {};
  if (!bookCache[version][book]) {
    await ensureVersionData(version);
    const data = loadVersionDataFromVar(cfg.localVar);
    if (!data) {
      throw new Error(`${cfg.label} data not loaded`);
    }
    const verseMap = extractBook(data, book);
    if (!verseMap) {
      throw new Error(`${book} not found in ${cfg.label}`);
    }
    bookCache[version][book] = verseMap;
  }
  return bookCache[version][book];
}

async function fetchChapterForVersion(version, book, chapter) {
  const verseMap = await fetchBookData(version, book);
  const verses = [];
  for (let vs = 1; vs <= 250; vs++) {
    const key = chapter + ':' + vs;
    if (!verseMap[key]) break;
    verses.push(verseMap[key]);
  }
  return verses;
}

async function fetchChapter(book, chapter) {
  const version = versionSelect.value;
  const verses = await fetchChapterForVersion(version, book, chapter);
  statusEl.textContent = `${verses.length} verses (${VERSIONS[version].label}).`;
  return verses;
}

async function checkForAppImageUpdate() {
  const releaseUrl = 'https://api.github.com/repos/RufusOliver/Holy-bible-A.S/releases/latest';
  try {
    const response = await fetch(releaseUrl, { headers: { Accept: 'application/vnd.github+json' } });
    if (!response.ok) throw new Error(`GitHub returned ${response.status}`);
    const release = await response.json();
    const asset = (release.assets || []).find(item => item.name.endsWith('.AppImage'));
    if (!asset) throw new Error('No Linux AppImage in the latest release');
    updateBtn.hidden = false;
    updateBtn.textContent = `\u2193 Update ${release.tag_name}`;
    updateBtn.onclick = () => window.open(asset.browser_download_url, '_blank', 'noopener');
    updateBtn.setAttribute('aria-label', `Download Linux AppImage ${release.tag_name}`);
  } catch (error) {
    updateBtn.hidden = true;
    console.warn('AppImage update check unavailable:', error.message);
  }
}
updateBtn.hidden = true;
checkForAppImageUpdate();

// --- Save state / bookmarks ---
// Primary storage is a user-picked folder (File System Access API) holding a
// single JSON file. When no folder is connected, falls back to localStorage.
// localStorage is always kept as a mirror so nothing is lost between sessions.
const LS_LAST_STATE = 'kgnt_lastState';
const LS_BOOKMARKS = 'kgnt_bookmarks';
const LS_TIMESTAMPS_PREFIX = 'kgnt_ts_';
const LS_SAVED_AT = 'kgnt_savedAt';
const STORAGE_FILE = 'bible-audio-sync-data.json';
const IDB_NAME = 'bible-audio-sync-db';
const IDB_STORE = 'handles';

let storageFolder = null;      // FileSystemDirectoryHandle
const storageCache = {};       // key -> raw string, mirror of the folder file
let storageDirty = false;
let storageWriteTimer = null;

function tsKey(version, book, chapter) {
  return LS_TIMESTAMPS_PREFIX + version + '|' + book + '|' + chapter;
}

function folderStorageActive() { return !!storageFolder; }

function rawLocalGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function rawLocalSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function rawLocalRemove(key) { try { localStorage.removeItem(key); } catch (e) {} }

function safeGet(key) {
  if (folderStorageActive() && storageCache[key] !== undefined) return storageCache[key];
  return rawLocalGet(key);
}
function safeSet(key, val) {
  rawLocalSet(key, val);
  rawLocalSet(LS_SAVED_AT, String(Date.now()));
  if (folderStorageActive()) {
    storageCache[key] = val;
    storageCache[LS_SAVED_AT] = String(Date.now());
    folderFlushSoon();
  }
}
function safeRemove(key) {
  rawLocalRemove(key);
  rawLocalSet(LS_SAVED_AT, String(Date.now()));
  if (folderStorageActive()) {
    delete storageCache[key];
    storageCache[LS_SAVED_AT] = String(Date.now());
    folderFlushSoon();
  }
}

async function folderFlush() {
  if (!folderStorageActive() || !storageDirty) return;
  storageDirty = false;
  clearTimeout(storageWriteTimer);
  try {
    const fh = await storageFolder.getFileHandle(STORAGE_FILE, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(storageCache));
    await w.close();
  } catch (e) {}
}

function folderFlushSoon() {
  if (!folderStorageActive()) return;
  storageDirty = true;
  clearTimeout(storageWriteTimer);
  storageWriteTimer = setTimeout(folderFlush, 300);
}

function copyLocalToCache() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('kgnt_') === 0) storageCache[k] = localStorage.getItem(k);
    }
  } catch (e) {}
}

function copyMissingLocalToCache() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('kgnt_') === 0 && storageCache[k] === undefined) {
        storageCache[k] = localStorage.getItem(k);
      }
    }
  } catch (e) {}
}

async function connectFolderHandle(handle) {
  storageFolder = handle;
  Object.keys(storageCache).forEach(k => delete storageCache[k]);
  let hasFile = false;
  try {
    const fh = await storageFolder.getFileHandle(STORAGE_FILE);
    const file = await fh.getFile();
    const text = await file.text();
    if (text) {
      Object.assign(storageCache, JSON.parse(text));
      hasFile = true;
    }
  } catch (e) { hasFile = false; }
  const localSavedAt = Number(rawLocalGet(LS_SAVED_AT) || 0);
  const folderSavedAt = Number(storageCache[LS_SAVED_AT] || 0);
  if (!hasFile || localSavedAt >= folderSavedAt) {
    copyLocalToCache();
    storageCache[LS_SAVED_AT] = String(localSavedAt);
  } else {
    copyMissingLocalToCache();
  }
  storageDirty = true;
  await folderFlush();
  updateStorageUI();
}

// IndexedDB helpers (to persist the folder handle across sessions)
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('no IndexedDB')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const rq = tx.objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = () => reject(rq.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function tryAutoReconnect() {
  if (!('showDirectoryPicker' in window)) return;
  try {
    const stored = await idbGet('dirHandle');
    if (!stored) return;
    const perm = await stored.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') await connectFolderHandle(stored);
  } catch (e) {}
}

function updateStorageUI() {
  const btn = document.getElementById('storageBtn');
  if (!btn) return;
  if (folderStorageActive()) {
    btn.textContent = 'Storage: ' + storageFolder.name;
    btn.classList.add('active');
  } else {
    btn.textContent = 'Storage: Browser';
    btn.classList.remove('active');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('storageBtn');
  if (!btn) return;
  btn.onclick = async () => {
    if (folderStorageActive()) {
      if (!confirm('Switch back to browser storage? Files already saved in the folder will be kept.')) return;
      storageFolder = null;
      try { await idbDel('dirHandle'); } catch (e) {}
      updateStorageUI();
      statusEl.textContent = 'Storage switched to browser.';
      return;
    }
    if (!('showDirectoryPicker' in window)) {
      statusEl.textContent = 'Folder storage needs Chrome or Edge.';
      return;
    }
    try {
      let handle = null;
      try {
        const stored = await idbGet('dirHandle');
        if (stored) {
          const perm = await stored.queryPermission({ mode: 'readwrite' });
          if (perm !== 'granted') {
            const req = await stored.requestPermission({ mode: 'readwrite' });
            if (req === 'granted') handle = stored;
          } else {
            handle = stored;
          }
        }
      } catch (e) { handle = null; }
      if (!handle) {
        handle = await window.showDirectoryPicker({ id: 'bible-storage' });
      }
      await idbPut('dirHandle', handle);
      await connectFolderHandle(handle);
      applyResumedState();
      statusEl.textContent = 'Connected to folder: ' + handle.name + '. Data saved to ' + STORAGE_FILE + '.';
      await loadChapter();
    } catch (e) {
      if (e && e.name === 'AbortError') statusEl.textContent = 'Folder selection cancelled.';
      else statusEl.textContent = 'Could not connect storage folder.';
    }
  };
});

window.addEventListener('pagehide', () => {
  if (storageDirty && folderStorageActive()) {
    try {
      const fh = storageFolder.getFileHandle(STORAGE_FILE, { create: true });
      fh.then(h => h.createWritable()).then(w => {
        w.write(JSON.stringify(storageCache));
        w.close();
      }).catch(() => {});
    } catch (e) {}
  }
});

function saveLastState() {
  safeSet(LS_LAST_STATE, JSON.stringify({
    version: versionSelect.value,
    book: currentBook,
    chapter: currentChapter,
    verseIndex: currentVerseIndex,
    strongs: showStrongsCb.checked,
    parallel: parallelCb.checked,
    par2: parallelCb.checked ? par2Sel.value : null,
    par3: parallelCb.checked ? par3Sel.value : null
  }));
}

function loadLastState() {
  const raw = safeGet(LS_LAST_STATE);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

function saveChapterTimestamps() {
  if (timestamps.some(t => t != null)) {
    safeSet(tsKey(versionSelect.value, currentBook, currentChapter), JSON.stringify(timestamps));
  } else {
    safeRemove(tsKey(versionSelect.value, currentBook, currentChapter));
  }
}

function loadChapterTimestamps() {
  const raw = safeGet(tsKey(versionSelect.value, currentBook, currentChapter));
  if (!raw) return null;
  try {
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.length === verses.length) return arr;
  } catch (e) {}
  return null;
}

function getBookmarks() {
  const raw = safeGet(LS_BOOKMARKS);
  if (!raw) return [];
  try { const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; } catch (e) { return []; }
}

function saveBookmarksList(list) {
  safeSet(LS_BOOKMARKS, JSON.stringify(list));
}

function renderBookmarkSelect() {
  const list = getBookmarks();
  const prevValue = bookmarkSelect.value;
  bookmarkSelect.innerHTML = '';
  bookmarkSelect.add(new Option('Bookmarks\u2026', ''));
  list.forEach(bm => {
    bookmarkSelect.add(new Option(bm.label, bm.id));
  });
  if (list.some(bm => bm.id === prevValue)) bookmarkSelect.value = prevValue;
}

bookmarkBtn.onclick = () => {
  const defaultLabel = `${currentBook} ${currentChapter}:${currentVerseIndex >= 0 ? currentVerseIndex + 1 : 1} (${VERSIONS[versionSelect.value].label})`;
  const label = prompt('Name this bookmark:', defaultLabel);
  if (label === null) return;
  const bm = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    label: label.trim() || defaultLabel,
    version: versionSelect.value,
    book: currentBook,
    chapter: currentChapter,
    verseIndex: currentVerseIndex >= 0 ? currentVerseIndex : 0,
    audioTime: audio.src ? audio.currentTime : null
  };
  const list = getBookmarks();
  list.push(bm);
  saveBookmarksList(list);
  renderBookmarkSelect();
  bookmarkSelect.value = bm.id;
  statusEl.textContent = `Bookmark saved: ${bm.label}`;
};

deleteBookmarkBtn.onclick = () => {
  const id = bookmarkSelect.value;
  if (!id) { statusEl.textContent = 'Select a bookmark to delete first.'; return; }
  const list = getBookmarks();
  const bm = list.find(b => b.id === id);
  if (!bm) return;
  if (!confirm(`Delete bookmark "${bm.label}"?`)) return;
  saveBookmarksList(list.filter(b => b.id !== id));
  renderBookmarkSelect();
  statusEl.textContent = 'Bookmark deleted.';
};

bookmarkSelect.onchange = () => {
  const id = bookmarkSelect.value;
  if (!id) return;
  const bm = getBookmarks().find(b => b.id === id);
  if (!bm) return;
  const pendingAudioTime = bm.audioTime;
  if (VERSIONS[bm.version]) versionSelect.value = bm.version;
  const bmLang = VERSIONS[bm.version] ? VERSIONS[bm.version].lang : 'en';
  const bmRtl = bmLang === 'ar' || bmLang === 'he' || bmLang === 'aii';
  document.body.classList.toggle('rtl', bmRtl);
  document.documentElement.lang = bmRtl ? bmLang : 'en';
  bookCache[versionSelect.value] = bookCache[versionSelect.value] || {};
  bookSelect.innerHTML = '';
  Object.keys(getBookList()).forEach(b => bookSelect.add(new Option(b, b)));
  if (getBookList()[bm.book]) {
    bookSelect.value = bm.book;
  } else {
    const first = Object.keys(getBookList())[0];
    if (first) bookSelect.value = first;
  }
  populateChapters();
  currentChapter = bm.chapter;
  chapterSelect.value = bm.chapter;
  loadVoices();
  loadChapter().then(() => {
    if (bm.verseIndex >= 0 && bm.verseIndex < verses.length) {
      currentVerseIndex = bm.verseIndex;
      highlightVerse(currentVerseIndex);
      const el = document.querySelector(`.verse[data-index="${currentVerseIndex}"]`);
      if (el) {
        programmaticScroll = true;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        scheduleProgrammaticScrollEnd();
      }
    }
    if (pendingAudioTime != null && audio.src) {
      audio.currentTime = pendingAudioTime;
    }
    statusEl.textContent = `Jumped to bookmark: ${bm.label}`;
  });
};

$('inspireBtn').onclick = async () => {
  const allVersions = Object.keys(VERSIONS);
  if (!allVersions.length) { statusEl.textContent = 'No data loaded.'; return; }
  const rv = allVersions[Math.floor(Math.random() * allVersions.length)];
  await ensureVersionData(rv);
  const data = loadVersionDataFromVar(VERSIONS[rv].localVar);
  if (!data) { statusEl.textContent = 'Data not loaded for ' + VERSIONS[rv].label + '.'; return; }
  const books = Object.keys(data);
  const randBook = books[Math.floor(Math.random() * books.length)];
  const chapters = Object.keys(data[randBook]);
  const randCh = chapters[Math.floor(Math.random() * chapters.length)];
  const versesObj = data[randBook][randCh];
  const vsKeys = Object.keys(versesObj);
  const randVs = vsKeys[Math.floor(Math.random() * vsKeys.length)];
  const text = versesObj[randVs];
  statusEl.textContent = `${randBook} ${randCh}:${randVs} (${VERSIONS[rv].label}) — ${text}`;
  versionSelect.value = rv;
  bookSelect.innerHTML = '';
  Object.keys(getBookList()).forEach(b => bookSelect.add(new Option(b, b)));
  if (getBookList()[randBook]) bookSelect.value = randBook;
  populateChapters();
  currentChapter = Number(randCh);
  chapterSelect.value = currentChapter;
  loadChapter().then(() => {
    const idx = Number(randVs) - 1;
    if (idx >= 0 && idx < verses.length) {
      currentVerseIndex = idx;
      highlightVerse(idx);
      const el = document.querySelector(`.verse[data-index="${idx}"]`);
      if (el) {
        programmaticScroll = true;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        scheduleProgrammaticScrollEnd();
      }
    }
  });
};

let resumedState = null;
let resumeVerseIndex = -1;

function applyResumedState() {
  resumedState = loadLastState();
  if (resumedState && VERSIONS[resumedState.version]) {
    versionSelect.value = resumedState.version;
  }
  const initLang = VERSIONS[versionSelect.value] ? VERSIONS[versionSelect.value].lang : 'en';
  const initRtl = initLang === 'ar' || initLang === 'he' || initLang === 'aii';
  document.body.classList.toggle('rtl', initRtl);
  document.documentElement.lang = initRtl ? initLang : 'en';

  bookSelect.innerHTML = '';
  Object.keys(getBookList()).forEach(b => bookSelect.add(new Option(b, b)));
  bookSelect.value = currentBook;
  if (resumedState && getBookList()[resumedState.book]) {
    currentBook = resumedState.book;
    bookSelect.value = currentBook;
  } else {
    const first = Object.keys(getBookList())[0];
    if (first) { currentBook = first; bookSelect.value = first; }
  }
  if (resumedState && resumedState.chapter) {
    currentChapter = resumedState.chapter;
  }
  if (resumedState && typeof resumedState.verseIndex === 'number') {
    resumeVerseIndex = resumedState.verseIndex;
  }
  if (resumedState && typeof resumedState.strongs === 'boolean') {
    showStrongsCb.checked = resumedState.strongs;
  }
  if (resumedState && typeof resumedState.parallel === 'boolean') {
    parallelCb.checked = resumedState.parallel;
  }
  if (resumedState && resumedState.par2 && VERSIONS[resumedState.par2]) par2Sel.value = resumedState.par2;
  if (resumedState && resumedState.par3 && VERSIONS[resumedState.par3]) par3Sel.value = resumedState.par3;
  syncParallelUI();
  populateChapters();
  renderBookmarkSelect();
  updateStorageUI();
}

versionSelect.onchange = () => {
  bookCache[versionSelect.value] = {};
  const lang = VERSIONS[versionSelect.value] ? VERSIONS[versionSelect.value].lang : 'en';
  const isRtl = lang === 'ar' || lang === 'he' || lang === 'aii';
  document.body.classList.toggle('rtl', isRtl);
  document.documentElement.lang = isRtl ? lang : 'en';
  const bl = getBookList();
  const prevBook = bookSelect.value;
  bookSelect.innerHTML = '';
  Object.keys(bl).forEach(b => bookSelect.add(new Option(b, b)));
  if (bl[prevBook]) {
    bookSelect.value = prevBook;
  } else {
    const first = Object.keys(bl)[0];
    if (first) bookSelect.value = first;
    currentBook = bookSelect.value;
  }
  populateChapters();
  loadVoices();
  loadChapter().catch(err => { statusEl.textContent = 'Error: ' + err.message; });
  autoLoadAudio();
};

function populateChapters() {
  const book = bookSelect.value;
  const maxChapters = getBookList()[book] || 0;
  chapterSelect.innerHTML = '';
  for (let i = 1; i <= maxChapters; i++) {
    chapterSelect.add(new Option(i, i));
  }
  if (currentChapter > maxChapters) currentChapter = 1;
  chapterSelect.value = currentChapter;
}

bookSelect.onchange = () => { populateChapters(); };
chapterSelect.onchange = () => { currentChapter = Number(chapterSelect.value); };

$('loadBtn').onclick = loadChapter;
$('resetTimestampsBtn').onclick = resetTimestamps;

let _loadChapterGeneration = 0;

async function loadChapter() {
  const gen = ++_loadChapterGeneration;
  currentBook = bookSelect.value;
  currentChapter = Number(chapterSelect.value);
  let data;
  try {
    data = await fetchChapter(currentBook, currentChapter);
  } catch (err) {
    versesContainer.innerHTML = `<div class="hint">Error: cannot load chapter - ${escHtml(err.message)}</div>`;
    statusEl.textContent = `Error: ${err.message}`;
    return;
  }
  if (gen !== _loadChapterGeneration) return;
  if (!data || data.length === 0) {
    versesContainer.innerHTML = '<div class="hint">Chapter loaded but no verses for this chapter in the source data.</div>';
    statusEl.textContent = `0 verses for ${currentBook} ${currentChapter} in ${VERSIONS[versionSelect.value].label}.`;
    return;
  }
  verses = data;
  if (parallelEnabled()) {
    parallelData = await Promise.all([
      (async () => { try { return await fetchChapterForVersion(par2Sel.value, bookNameForVersion(par2Sel.value, currentBook), currentChapter); } catch (e) { return null; } })(),
      (async () => { try { return await fetchChapterForVersion(par3Sel.value, bookNameForVersion(par3Sel.value, currentBook), currentChapter); } catch (e) { return null; } })()
    ]);
  } else {
    parallelData = null;
  }
  if (gen !== _loadChapterGeneration) return;
  const savedTs = loadChapterTimestamps();
  timestamps = savedTs || new Array(verses.length).fill(null);
  currentVerseIndex = -1;
  renderVerses();
  chapterTitle.textContent = `${currentBook} ${currentChapter}`;
  statusEl.textContent = savedTs
    ? `${verses.length} verses. Restored saved timestamps for this chapter.`
    : `${verses.length} verses. Load an audio file, then set timestamps. Click each verse at the right time.`;
  updateVerseInfo();
  saveLastState();
  autoLoadAudio();
}

function stripDiacritics(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function lookupStrongs(word) {
  const key = stripDiacritics(word.replace(/[.,:;!?·-]+$/g, '')).toLowerCase();
  const sn = window._DATA_strongs && window._DATA_strongs[key];
  if (!sn) return null;
  return Array.isArray(sn) ? sn.join('/') : sn;
}

// KJV and KJV-based translations use the archaic KJV dictionary rather
// than Strong's numbers (KJV English words have no Greek/Hebrew alignment).
const KJV_DICT_VERSIONS = ['KJV', 'AKJV', 'WEBSTER'];

function isKjvDictVersion(version) {
  return KJV_DICT_VERSIONS.includes(version || versionSelect.value);
}

function lookupKjvDict(word) {
  const data = window._DATA_kjvdict;
  if (!data) return null;
  const wordStr = String(word).trim();
  
  // Try direct lookup after removing trailing punctuation
  let key = stripDiacritics(wordStr.replace(/[.,:;!?·-]+$/g, '')).toLowerCase();
  if (data[key]) return data[key];
  
  // Try after also removing KJV brackets [was] -> was
  key = stripDiacritics(wordStr.replace(/^\[|\]$/g, '').replace(/[.,:;!?·-]+$/g, '')).toLowerCase();
  if (data[key]) return data[key];
  
  return null;
}

function interlinearEnabled() {
  return showStrongsCb.checked && 'Matthew' in getBookList();
}

function parallelEnabled() {
  return parallelCb.checked;
}

function syncParallelUI() {
  parallelBar.style.display = parallelCb.checked ? 'flex' : 'none';
  document.body.classList.toggle('parallel', parallelCb.checked);
}

function populateParallelSelects() {
  par2Sel.innerHTML = '';
  par3Sel.innerHTML = '';
  Object.keys(VERSIONS).forEach(v => {
    par2Sel.add(new Option(VERSIONS[v].label, v));
    par3Sel.add(new Option(VERSIONS[v].label, v));
  });
  const mainV = versionSelect.value;
  const prefs = ['NHEB', 'Arabic', 'NAV', 'SBLGNT', 'Byzantine', 'Orthodox'];
  const avails = prefs.filter(p => p !== mainV);
  par2Sel.value = avails[0] || '';
  par3Sel.value = avails[1] || '';
}

parallelCb.onchange = () => {
  syncParallelUI();
  saveLastState();
  loadChapter();
};
par2Sel.onchange = () => { saveLastState(); loadChapter(); };
par3Sel.onchange = () => { saveLastState(); loadChapter(); };

function interlinearEntry(word, verseNum, wordIdx, version) {
  const data = window._DATA_interlinear;
  if (!data) return null;
  if ((version || versionSelect.value) === 'SBLGNT') {
    const vpos = data.position[currentBook] && data.position[currentBook][String(currentChapter)] && data.position[currentBook][String(currentChapter)][String(verseNum)];
    const entry = vpos && vpos[wordIdx];
    if (entry) return entry;
    return null;
  }
  const key = stripDiacritics(word.replace(/[.,:;!?·-]+$/g, '')).toLowerCase();
  const gloss = data.glosses[key];
  if (!gloss) return null;
  return Array.isArray(gloss) ? [gloss[0], gloss[1]] : [lookupStrongs(word), gloss];
}

function verseMarkup(v, i, primary, version) {
  const showSn = showStrongsCb.checked;
  const kjvMode = showSn && isKjvDictVersion(version);
  const kjvData = kjvMode ? (window._DATA_kjvdict || null) : null;
  let wordIdx = 0;
  const words = v.split(/(\s+)/).map((tok, ti) => tok.match(/^\s+$/) ? tok : (() => {
    const il = showSn ? interlinearEntry(tok, i + 1, wordIdx, version) : null;
    wordIdx++;
    const fullSn = il ? lookupStrongs(tok) : null;
    const sn = (il && il[0]) ? il[0] : fullSn;
    const wordAttr = ` data-word="${escHtml(tok)}"`;
    const gAttr = (il && il[0]) ? ` data-g="${escHtml(il[0])}"` : '';
    const snAttr = sn ? ` data-sn="${escHtml(fullSn || sn)}"` : '';
    // For KJV-family versions, tag words that have an archaic dictionary entry so
    // clicking them opens the King James Dictionary instead of Strong's, and show their
    // definition as an interlinear gloss when the Interlinear button is on.
    const kjvDef = kjvData ? lookupKjvDict(tok) : null;
    const kjvAttr = kjvDef ? ` data-kjv="1"` : '';
    let inner = escHtml(tok);
    if (il && (il[0] || il[1])) {
      inner = `<span class="sn">${escHtml(il[0] || sn || '')}</span>${escHtml(tok)}${il[1] ? `<span class="en">${escHtml(il[1])}</span>` : ''}`;
    } else if (showSn && sn) {
      inner = `<span class="sn">${escHtml(sn)}</span>${escHtml(tok)}`;
    } else if (showSn && kjvDef) {
      inner = `${escHtml(tok)}<span class="en kjv">${escHtml(kjvDef)}</span>`;
    }
    return `<span class="w" data-i="${ti}"${snAttr}${wordAttr}${gAttr}${kjvAttr}>${inner}</span>`;
  })()).join('');
  return `<div class="verse"${primary ? ` data-index="${i}"` : ''}>
    <span class="num">${i+1}</span>${words}${primary ? `<span class="timestamp-badge">${timestamps[i] != null ? formatTime(timestamps[i]) : '--:--'}</span>` : ''}
  </div>`;
}

function renderVerses() {
  if (parallelEnabled()) {
    const panes = [];
    const paneVersions = [versionSelect.value, par2Sel.value, par3Sel.value];
    const paneData = [verses, parallelData && parallelData[0], parallelData && parallelData[1]];
    for (let p = 0; p < 3; p++) {
      const d = paneData[p];
      const body = d && d.length
        ? d.map((v, i) => verseMarkup(v, i, p === 0, paneVersions[p])).join('')
        : `<div class="hint">This version has no verses for ${currentBook} ${currentChapter}.</div>`;
      panes.push(`<div class="pane${p === 0 ? ' pane-primary' : ''}">
        <div class="pane-title">${escHtml(VERSIONS[paneVersions[p]] ? VERSIONS[paneVersions[p]].label : paneVersions[p])}</div>
        ${body}
      </div>`);
    }
    versesContainer.innerHTML = panes.join('');
    document.body.classList.add('parallel');
  } else {
    document.body.classList.remove('parallel');
    versesContainer.innerHTML = verses.map((v, i) => verseMarkup(v, i, true, versionSelect.value)).join('');
  }
  versesContainer.querySelectorAll('.verse[data-index]').forEach(el => {
    el.onclick = () => {
      userScrolledAway = false;
      if (timestampModeCb.checked) {
        setTimestamp(Number(el.dataset.index));
      }
    };
  });
  if (currentVerseIndex >= 0) highlightVerse(currentVerseIndex);
}

let userScrolledAway = false;
let programmaticScroll = false;
let scrollResetTimer = null;

function scheduleProgrammaticScrollEnd() {
  clearTimeout(scrollResetTimer);
  // Debounced: only clears once no scroll events have fired for a bit,
  // so long smooth-scrolls (longer English verses covering more screen
  // distance) don't get cut off mid-animation and misread as a user scroll.
  scrollResetTimer = setTimeout(() => { programmaticScroll = false; }, 400);
}

function highlightVerse(idx) {
  document.querySelectorAll('.verse').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.verse[data-index="${idx}"]`);
  if (!el) return;
  el.classList.add('active');
  currentVerseInfo.textContent = `verse ${idx+1}`;
  saveLastState();
  if (autoScrollCb.checked && !userScrolledAway) {
    programmaticScroll = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    scheduleProgrammaticScrollEnd();
  }
}

function isElementOutOfView(el) {
  const rect = el.getBoundingClientRect();
  return rect.bottom < 0 || rect.top > window.innerHeight;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // A smooth-scroll animation in flight when the tab is hidden gets
    // paused/throttled by the browser, but this timer keeps running
    // regardless. Clear it (without flipping programmaticScroll false)
    // so the flag stays true for the whole time we're backgrounded.
    clearTimeout(scrollResetTimer);
  } else if (programmaticScroll) {
    // Coming back visible mid-scroll: the paused animation is about to
    // resume and fire its own scroll events. Give it a fresh window to
    // finish before we start trusting scroll events as user-initiated
    // again, otherwise the resumed animation gets misread as the user
    // scrolling away and auto-scroll breaks.
    scheduleProgrammaticScrollEnd();
  }
});

let _scrollThrottle = null;
window.addEventListener('scroll', () => {
  if (_scrollThrottle) return;
  _scrollThrottle = setTimeout(() => { _scrollThrottle = null; }, 100);
  if (programmaticScroll) {
    scheduleProgrammaticScrollEnd();
    return;
  }
  const active = document.querySelector('.verse.active');
  if (!active) return;
  if (isElementOutOfView(active)) userScrolledAway = true;
}, { passive: true });

function updateVerseInfo() {
  if (currentVerseIndex >= 0) currentVerseInfo.textContent = `verse ${currentVerseIndex+1}`;
  else currentVerseInfo.textContent = '--';
}

function setTimestamp(idx) {
  if (!audio.src) { statusEl.textContent = 'Load an audio file first.'; return; }
  const currentTime = audio.currentTime;
  timestamps[idx] = currentTime;
  const badge = document.querySelector(`.verse[data-index="${idx}"] .timestamp-badge`);
  if (badge) badge.textContent = formatTime(currentTime);
  statusEl.textContent = `Timestamp set: verse ${idx+1} at ${formatTime(currentTime)}`;
  saveChapterTimestamps();
}

function resetTimestamps() {
  if (!confirm('Reset all timestamps for this chapter?')) return;
  timestamps = new Array(verses.length).fill(null);
  document.querySelectorAll('.timestamp-badge').forEach(el => el.textContent = '--:--');
  currentVerseIndex = -1;
  document.querySelectorAll('.verse').forEach(el => el.classList.remove('active'));
  currentVerseInfo.textContent = '--';
  statusEl.textContent = 'Timestamps reset.';
  safeRemove(tsKey(versionSelect.value, currentBook, currentChapter));
}

// Audio handling
audioFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (audio.src && audio.src.startsWith('blob:')) URL.revokeObjectURL(audio.src);
  const url = URL.createObjectURL(file);
  audio.src = url;
  audio.load();
  setVolume(volumeSlider.value);
  statusEl.textContent = `Loaded: ${file.name}`;
};

const librivoxCache = {};

async function fetchLibrivoxFiles(identifier) {
  if (librivoxCache[identifier]) return librivoxCache[identifier];
  const res = await fetch(`https://archive.org/metadata/${identifier}/files`);
  if (!res.ok) throw new Error(`Archive.org returned ${res.status}`);
  const data = await res.json();
  const mp3s = (data.result || data.files || []).filter(f => f.name.endsWith('.mp3'));
  mp3s.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
  librivoxCache[identifier] = mp3s;
  return mp3s;
}

function matchChapter(files, chapter) {
  const ch = String(chapter);
  const patterns = [
    new RegExp(`(?:chapter|ch|_ch_|_ch)\\s*${ch}\\b`, 'i'),
    new RegExp(`\\b${ch}\\.`),
    new RegExp(`\\b${ch}_`),
    new RegExp(`\\b0*${ch}\\b`)
  ];
  for (const pat of patterns) {
    const m = files.find(f => pat.test(f.name));
    if (m) return m;
  }
  if (files.length >= chapter) return files[chapter - 1];
  return null;
}

async function autoLoadAudio() {
  const ver = versionSelect.value;
  const book = currentBook;
  const chapter = currentChapter;
  if (!AUDIO_VERSIONS.includes(ver) || !book || !chapter) return;
  const libriMap = LIBRIVOX_MAP[ver];
  if (!libriMap) return;

  if (ver === 'ASV') {
    try {
      const files = await fetchLibrivoxFiles('englishAudioASV');
      const slug = book.toLowerCase().replace(/[^a-z0-9]/g, '');
      const bookFiles = files.filter(file => file.name.startsWith(`englishasv/${slug}/`));
      const file = matchChapter(bookFiles, chapter);
      if (!file) throw new Error('ASV chapter unavailable');
      audio.src = `https://archive.org/download/englishAudioASV/${file.name.split('/').map(encodeURIComponent).join('/')}`;
      audio.load();
      setVolume(volumeSlider.value);
      statusEl.textContent = `Audio: ${book} ${chapter} (streaming)`;
    } catch (err) {
      statusEl.textContent = `Audio unavailable for ${book} ${chapter}.`;
    }
    return;
  }

  const identifier = libriMap[book];
  if (!identifier) return;

  const folder = ver.toLowerCase();
  const localDir = `${AUDIO_BASE}/${folder}`;

  try {
    const resp = await fetch(`${localDir}/`, { method: 'HEAD' });
    if (!resp.ok) throw new Error('no local dir');
    const res = await fetch(`https://archive.org/metadata/${identifier}/files`);
    if (!res.ok) throw new Error('Archive.org fetch failed');
    const data = await res.json();
    const allFiles = (data.result || data.files || []).filter(f => f.name.endsWith('.mp3'));
    allFiles.sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { numeric: true }));
    const file = matchChapter(allFiles, chapter);
    if (file) {
      const localPath = `${localDir}/${file.name}`;
      try {
        const lr = await fetch(localPath, { method: 'HEAD' });
        if (lr.ok) {
          audio.src = localPath;
          audio.load();
          setVolume(volumeSlider.value);
          statusEl.textContent = `Audio: ${book} ${chapter}`;
          return;
        }
  } catch (e) {
    console.warn('Failed to save storage:', e);
    statusEl.textContent = 'Warning: could not save data to folder.';
  }
    }
  } catch (e) {}

  try {
    const files = await fetchLibrivoxFiles(identifier);
    if (!files.length) return;
    const file = matchChapter(files, chapter);
    if (!file) return;
    const url = `https://archive.org/download/${identifier}/${encodeURIComponent(file.name)}`;
    audio.src = url;
    audio.load();
    setVolume(volumeSlider.value);

function updateSync() {
  if (timestamps.every(t => t == null)) return;
  const valid = timestamps.map((t,i) => ({t,i})).filter(x => x.t != null).sort((a,b) => a.t - b.t);
  if (!valid.length) return;
  let best = valid[0].i;
  for (let i = 1; i < valid.length; i++) {
    if (audio.currentTime >= valid[i].t) best = valid[i].i;
  }
  if (best !== currentVerseIndex) {
    currentVerseIndex = best;
    highlightVerse(currentVerseIndex);
  }
}

function scoreDictTokens(text, wl) {
  if (!wl) return -1;
  let best = -1;
  const tokens = String(text).replace(/<[^>]+>/g, ' ').replace(/\(.*?\)/g, ' ')
    .split(/[,\s]+/).map(t => t.replace(/^[^a-z]+|[^a-z]+$/gi, '').toLowerCase())
    .filter(t => t.length >= 2);
  for (const tl of tokens) {
    let s = -1;
    if (tl === wl) s = 100;
    else if (tl.length >= 3 && tl.startsWith(wl) && tl.length <= wl.length + 3) s = 6 + tl.length;
    else if (wl.length >= 4 && wl.startsWith(tl) && tl.length >= 3) s = 3;
    if (s > best) best = s;
  }
  return best;
}

function renderDictEntry(num, e) {
  if (num.startsWith('H') && window._DATA_bdb && window._DATA_bdb[num]) {
    return `<div class="dict-entry"><div class="dict-num">${escHtml(num)}</div><p class="dict-def">${window._DATA_bdb[num]}</p></div>`;
  }
  if (!e) return `<div class="dict-entry"><p class="dict-none">No entry for ${escHtml(num)}.</p></div>`;
  let html = `<div class="dict-entry">`;
  html += `<div class="dict-num">${escHtml(num)}</div>`;
  html += `<div class="dict-lemma">${e.l ? escHtml(e.l) : escHtml(num)}${e.t ? ` <span class="dict-translit">(${escHtml(e.t)})</span>` : ''}</div>`;
  if (e.d) html += `<p class="dict-def">${escHtml(e.d)}</p>`;
  if (e.r) html += `<p class="dict-deriv">${escHtml(e.r)}</p>`;
  if (e.k) html += `<p class="dict-kjv"><span class="dict-kjv-label">KJV:</span> ${escHtml(e.k)}</p>`;
  if (e.th) {
    html += `<div class="dict-section-label">Thayer's Lexicon</div>`;
    html += `<p class="dict-def">${escHtml(e.th)}</p>`;
  }
  html += `</div>`;
  return html;
}

async function openWordDict(snString, wordText, preferred) {
  activeDict = 'strongs';
  dictOverlay.querySelectorAll('.dict-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.dict === 'strongs');
  });
  const nums = String(snString).split('/');
  const found = nums
    .map(g => ({ g: g, e: (window._DATA_lexicon && window._DATA_lexicon[g]) || null }))
    .filter(x => x.g.startsWith('H') ? window._DATA_bdb || true : x.e);
  const titleEl = dictOverlay.querySelector('.dict-title');
  const body = dictOverlay.querySelector('.dict-body');

  if (!found.length) {
    titleEl.textContent = "Strong's Dictionary";
    body.innerHTML = `<div class="dict-entry"><p class="dict-none">No dictionary entry for ${escHtml(nums.join(', '))}.</p></div>`;
    dictOverlay.classList.add('open');
    return;
  }

  const wl = wordText
    ? stripDiacritics(String(wordText).replace(/[.,:;!?·-]+$/g, '')).toLowerCase()
    : '';
  const isNT = !(currentBook in OT_BOOKS);
  const hasH = found.some(x => x.g.startsWith('H'));
  if (hasH && ((wl && !isNT) || !wl) && !window._DATA_bdb) await ensureDictData('bdb');

  const scored = found.map(f => ({ f, s: f.g.startsWith('H')
    ? scoreDictTokens(window._DATA_bdb ? window._DATA_bdb[f.g] : '', wl)
    : scoreDictTokens(f.e ? f.e.k : '', wl) }));
  scored.sort((a, b) => b.s - a.s);

  let cur = scored[0].f;
  if (preferred) {
    const prec = found.find(f => f.g === preferred);
    if (prec) cur = prec;
  } else if (wl) {
    const gBest = scored.find(z => z.f.g.startsWith('G'));
    const hBest = scored.find(z => z.f.g.startsWith('H'));
    if (isNT) {
      if (gBest && gBest.s >= 3) cur = gBest.f;
      else if (hBest && hBest.s > (gBest ? gBest.s : 0)) cur = hBest.f;
    } else {
      if (hBest && hBest.s >= 3) cur = hBest.f;
      else if (gBest && gBest.s > (hBest ? hBest.s : 0)) cur = gBest.f;
    }
  }

  const hasG = found.some(x => x.g.startsWith('G'));
  if (activeDict === 'thayers') titleEl.textContent = "Thayer's Greek Lexicon";
  else if (found.length === 1) titleEl.textContent = hasH ? "Strong's Hebrew Dictionary" : "Strong's Greek Dictionary";
  else if (hasG && hasH) titleEl.textContent = "Strong's Dictionary (Greek + Hebrew)";
  else titleEl.textContent = hasH ? "Strong's Hebrew Dictionary" : "Strong's Greek Dictionary";

  let html = '';
  if (found.length > 1) {
    html += `<div class="dict-chips">${found.map(f =>
      `<button class="dict-chip${f.g === cur.g ? ' active' : ''}" data-g="${escHtml(f.g)}" type="button">${escHtml(f.g)}</button>`).join('')}</div>`;
  }
  const curE = cur.g.startsWith('H') ? null : cur.e;
  html += `<div class="current-entry-wrap">${renderDictEntry(cur.g, curE)}</div>`;
  body.innerHTML = html;
  dictOverlay.classList.add('open');
}

const dictSearchInput = document.getElementById('dictSearchInput');
const dictSearchBtn = document.getElementById('dictSearchBtn');
async function dictSearch() {
  const q = dictSearchInput.value.trim();
  if (!q) return;
  const body = dictOverlay.querySelector('.dict-body');
  const titleEl = dictOverlay.querySelector('.dict-title');

  if (activeDict === 'strongs' || activeDict === 'thayers') {
    titleEl.textContent = activeDict === 'thayers' ? "Thayer's Greek Lexicon" : "Strong's Dictionary";
    if (/^[gh]\d+/i.test(q)) {
      openWordDict(q.toUpperCase());
      return;
    }
    const matches = Object.entries(_DATA_lexicon).filter(([k, v]) => {
      if (activeDict === 'thayers') {
        const searchable = ((v.l || '') + ' ' + (v.th || '') + ' ' + (v.t || '')).toLowerCase();
        return searchable.includes(q.toLowerCase());
      }
      const searchable = ((v.l || '') + ' ' + (v.k || '') + ' ' + (v.d || '')).toLowerCase();
      return searchable.includes(q.toLowerCase());
    }).slice(0, 20);
    if (!matches.length) {
      body.innerHTML = `<div class="dict-entry"><p class="dict-none">No results for "${escHtml(q)}".</p></div>`;
    } else {
      body.innerHTML = matches.map(([k, v]) => {
        let html = `<div class="dict-entry"><div class="dict-num">${escHtml(k)}</div>`;
        html += `<div class="dict-lemma">${v.l ? escHtml(v.l) : ''}${v.t ? ` <span class="dict-translit">(${escHtml(v.t)})</span>` : ''}</div>`;
        if (activeDict === 'thayers' && v.th) {
          html += `<p class="dict-def">${escHtml(v.th)}</p>`;
        } else {
          if (v.d) html += `<p class="dict-def">${escHtml(v.d)}</p>`;
          if (v.k) html += `<p class="dict-kjv"><span class="dict-kjv-label">KJV:</span> ${escHtml(v.k)}</p>`;
        }
        html += `</div>`;
        return html;
      }).join('');
    }
    dictOverlay.classList.add('open');
    return;
  }

  if (activeDict === 'bdb') {
    titleEl.textContent = DICT_SOURCES.bdb.name;
    dictSearchInput.placeholder = DICT_SOURCES.bdb.placeholder;
    const loaded = await ensureDictData('bdb');
    if (!loaded) { body.innerHTML = `<div class="dict-entry"><p class="dict-none">Failed to load BDB.</p></div>`; dictOverlay.classList.add('open'); return; }
    if (/^[gh]\d+/i.test(q)) {
      const val = window._DATA_bdb[q.toUpperCase()];
      if (val) {
        body.innerHTML = `<div class="dict-entry"><div class="dict-num">${escHtml(q.toUpperCase())}</div><p class="dict-def">${val}</p></div>`;
      } else {
        body.innerHTML = `<div class="dict-entry"><p class="dict-none">No BDB entry for ${escHtml(q.toUpperCase())}.</p></div>`;
      }
    } else {
      const qLower = q.toLowerCase();
      const matches = Object.entries(window._DATA_bdb).filter(([k, v]) => {
        return k.toLowerCase().includes(qLower) || String(v).toLowerCase().includes(qLower);
      }).slice(0, 20);
      if (!matches.length) {
        body.innerHTML = `<div class="dict-entry"><p class="dict-none">No results for "${escHtml(q)}".</p></div>`;
      } else {
        body.innerHTML = matches.map(([k, v]) => {
          return `<div class="dict-entry"><div class="dict-num">${escHtml(k)}</div><p class="dict-def">${v}</p></div>`;
        }).join('');
      }
    }
    dictOverlay.classList.add('open');
    return;
  }

  if (activeDict === 'vines') {
    titleEl.textContent = DICT_SOURCES.vines.name;

    const data = window._DATA_vines;
    const qLower = q.toLowerCase();
    const exact = data[q.toUpperCase()];
    const matches = Object.entries(data).filter(([k]) => k.toLowerCase().includes(qLower)).slice(0, 30);
    if (exact && !matches.find(([k]) => k === q.toUpperCase())) {
      matches.unshift([q.toUpperCase(), exact]);
    }
    if (!matches.length) {
      body.innerHTML = `<div class="dict-entry"><p class="dict-none">No results for "${escHtml(q)}".</p></div>`;
    } else {
      body.innerHTML = matches.map(([k, v]) => {

      }).join('');

  }

  if (activeDict === 'jfb' || activeDict === 'gills') {
    const src = DICT_SOURCES[activeDict];
    titleEl.textContent = src.name;
    dictSearchInput.placeholder = src.placeholder;
    const loaded = await ensureDictData(activeDict);
    if (!loaded) { body.innerHTML = `<div class="dict-entry"><p class="dict-none">Failed to load ${src.name}.</p></div>`; dictOverlay.classList.add('open'); return; }
    const data = window[src.var];
    const qLower = q.toLowerCase();
    const BOOK_ALIASES = {
      'gen': 'Genesis', 'exo': 'Exodus', 'lev': 'Leviticus', 'num': 'Numbers', 'deu': 'Deuteronomy',
      'jos': 'Joshua', 'jdg': 'Judges', 'rut': 'Ruth', 'sa1': '1 Samuel', 'sa2': '2 Samuel',
      'ki1': '1 Kings', 'ki2': '2 Kings', 'ch1': '1 Chronicles', 'ch2': '2 Chronicles',
      'ezr': 'Ezra', 'neh': 'Nehemiah', 'est': 'Esther', 'job': 'Job', 'psa': 'Psalms',
      'pro': 'Proverbs', 'ecc': 'Ecclesiastes', 'sol': 'Song of Solomon', 'isa': 'Isaiah',
      'jer': 'Jeremiah', 'lam': 'Lamentations', 'eze': 'Ezekiel', 'dan': 'Daniel',
      'hos': 'Hosea', 'joe': 'Joel', 'amo': 'Amos', 'oba': 'Obadiah', 'jon': 'Jonah',
      'mic': 'Micah', 'nah': 'Nahum', 'hab': 'Habakkuk', 'zep': 'Zephaniah',
      'hag': 'Haggai', 'zac': 'Zechariah', 'mal': 'Malachi',
      'mat': 'Matthew', 'mar': 'Mark', 'luk': 'Luke', 'joh': 'John', 'act': 'Acts',
      'rom': 'Romans', 'co1': '1 Corinthians', 'co2': '2 Corinthians', 'gal': 'Galatians',
      'eph': 'Ephesians', 'php': 'Philippians', 'col': 'Colossians',
      'th1': '1 Thessalonians', 'th2': '2 Thessalonians', 'ti1': '1 Timothy', 'ti2': '2 Timothy',
      'tit': 'Titus', 'phm': 'Philemon', 'heb': 'Hebrews', 'jam': 'James',
      'pe1': '1 Peter', 'pe2': '2 Peter', 'jn1': '1 John', 'jn2': '2 John', 'jn3': '3 John',
      'jud': 'Jude', 'rev': 'Revelation'
    };
    const parseRef = (str) => {
      const m = str.match(/^(\d?\s*\w+)\s+(\d+):(\d+)/i);
      if (m) {
        const bookPart = m[1].trim().toLowerCase().replace(/\s+/g, '');
        const alias = BOOK_ALIASES[bookPart] || bookPart;
        const book = Object.keys(data).find(b => b.toLowerCase().replace(/\s+/g, '') === alias.toLowerCase().replace(/\s+/g, '') || b.toLowerCase().startsWith(qLower));
        return { book: book || m[1], chapter: parseInt(m[2]), verse: parseInt(m[3]) };
      }
      const m2 = str.match(/^(\d?\s*\w+)\s+(\d+)/i);
      if (m2) {
        const bookPart = m2[1].trim().toLowerCase().replace(/\s+/g, '');
        const alias = BOOK_ALIASES[bookPart] || bookPart;
        const book = Object.keys(data).find(b => b.toLowerCase().replace(/\s+/g, '') === alias.toLowerCase().replace(/\s+/g, '') || b.toLowerCase().startsWith(qLower));
        return { book: book || m2[1], chapter: parseInt(m2[2]), verse: 0 };
      }
      return null;
    };
    const ref = parseRef(q);
    if (ref && data[ref.book]) {
      const chData = data[ref.book][ref.chapter];
      if (chData) {
        let entries;
        if (ref.verse && chData[ref.verse]) {
          entries = [[`${ref.book} ${ref.chapter}:${ref.verse}`, chData[ref.verse]]];
        } else {
          entries = Object.entries(chData).map(([v, h]) => [`${ref.book} ${ref.chapter}:${v}`, h]).slice(0, 20);
        }
        body.innerHTML = entries.map(([label, html]) => {
          return `<div class="dict-entry"><div class="dict-lemma">${escHtml(label)}</div><p class="dict-topical">${escHtml(html)}</p></div>`;
        }).join('');
      } else {
        body.innerHTML = `<div class="dict-entry"><p class="dict-none">Chapter ${ref.chapter} not found in ${ref.book}.</p></div>`;
      }
    } else {
      const bookMatches = Object.keys(data).filter(b => b.toLowerCase().includes(qLower)).slice(0, 10);
      if (bookMatches.length) {
        body.innerHTML = bookMatches.map(book => {
          const chapters = Object.keys(data[book]).sort((a, b) => a - b);
          return `<div class="dict-entry"><div class="dict-lemma">${escHtml(book)}</div><p class="dict-topical">${chapters.length} chapters available</p></div>`;
        }).join('');
      } else {
        body.innerHTML = `<div class="dict-entry"><p class="dict-none">No results for "${escHtml(q)}". Try "John 3" or "Genesis 1:1".</p></div>`;
      }
    }
    dictOverlay.classList.add('open');
    return;
  }

  const dictMap = { eastons: window._DATA_eastons, smiths: window._DATA_smiths, hitchcocks: window._DATA_hitchcocks, faussets: window._DATA_faussets };
  const dictNames = { eastons: "Easton's Bible Dictionary", smiths: "Smith's Bible Dictionary", hitchcocks: "Hitchcock's Bible Names", faussets: "Fausset's Bible Dictionary" };
  if (DICT_SOURCES[activeDict] && !dictMap[activeDict]) {
    await ensureDictData(activeDict);
    dictMap[activeDict] = window[DICT_SOURCES[activeDict].var];
  }
  const data = dictMap[activeDict];
  titleEl.textContent = dictNames[activeDict] || 'Dictionary';
  if (!data) {
    body.innerHTML = `<div class="dict-entry"><p class="dict-none">Dictionary not loaded.</p></div>`;
    dictOverlay.classList.add('open');
    return;
  }
  const qLower = q.toLowerCase();
  const exact = data[q] || data[q.charAt(0).toUpperCase() + q.slice(1)];
  const matches = Object.entries(data).filter(([k]) => k.toLowerCase().includes(qLower)).slice(0, 30);
  if (exact && !matches.find(([k]) => k === (data[q] ? q : q.charAt(0).toUpperCase() + q.slice(1)))) {
    matches.unshift([q, exact]);
  }
  if (!matches.length) {
    body.innerHTML = `<div class="dict-entry"><p class="dict-none">No results for "${escHtml(q)}".</p></div>`;
  } else {
    body.innerHTML = matches.map(([k, v]) => {
      return `<div class="dict-entry">
        <div class="dict-lemma">${escHtml(k)}</div>
        <p class="dict-topical">${escHtml(v)}</p>
      </div>`;
    }).join('');
  }
  dictOverlay.classList.add('open');
}
