name: Feature Request
description: Suggest a new feature for Holy Bible A.S
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Have an idea to make the app better? Tell us!

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
      placeholder: "I always want to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of the app does this affect?
      options:
        - Audio playback
        - TTS / Audiobook
        - Bible text / Translations
        - Dictionary
        - Interlinear
        - Bookmarks
        - Parallel reading
        - Dyslexia mode
        - UI / Layout
        - New translation
        - New dictionary
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve this?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, examples from other apps, etc.
