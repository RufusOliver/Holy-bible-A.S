name: Link Check

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'index.html'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Check for broken links
        uses: hashicorp/gh-action-check-broken-links@v1
        with:
          baseUrl: https://github.com/${{ github.repository }}
          files: |
            README.md
            index.html
