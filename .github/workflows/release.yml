name: Build Native Linux AppImage Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'index.html'
      - 'data/**'
      - 'audio/**'
      - 'native-linux/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            gcc \
            pkg-config \
            file

      - name: Build native AppImage
        run: bash native-linux/build-appimage.sh

      - name: Upload release AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Holy Bible A.S ${{ github.ref_name }}"
          files: releases/*.AppImage
          draft: false
          prerelease: false
