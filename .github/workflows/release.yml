name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build AppImage
        run: npm run build:linux

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Holy Bible A.S ${{ steps.version.outputs.tag }}"
          body: |
            ## Holy Bible A.S ${{ steps.version.outputs.tag }}

            ### Download
            - **Linux AppImage**: `Holy-Bible-A.S-${{ steps.version.outputs.tag }}.AppImage` — works on any Linux distro
            - **Arch Linux**: `holy-bible-a-s-${{ steps.version.outputs.tag }}-x86_64.pkg.tar.zst` — native Arch package
            - **Windows installer**: See Windows build below
            - **macOS DMG**: See Mac build below

            ### Features
            - 60+ Bible translations
            - TTS audiobook with verse highlighting
            - Strong's, Thayer's, BDB, Vine's, Easton's, Smith's, Fausset's, Hitchcock's, JFB, Gill's dictionaries
            - Interlinear mode with Greek/Hebrew
            - Dyslexia-friendly mode with OpenDyslexic font
            - Parallel reading (3-way)
            - Bookmarks & storage sync
            - Keyboard shortcuts

            ### Linux AppImage
            ```bash
            chmod +x Holy-Bible-A.S-*.AppImage
            ./Holy-Bible-A.S-*.AppImage
            ```

            ### Arch Linux
            ```bash
            # Install with pacman
            sudo pacman -U holy-bible-a-s-*-x86_64.pkg.tar.zst

            # Or extract and run directly
            tar -xf holy-bible-a-s-*-x86_64.pkg.tar.zst
            ./usr/bin/holy-bible-a-s
            ```
          files: |
            dist/*.AppImage
          draft: false
          prerelease: false

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git nodejs npm base-devel

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Electron for Linux
        run: npx electron-builder --linux dir

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" | sed 's/v//' >> $GITHUB_OUTPUT

      - name: Create Arch package structure
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          PKG_NAME="holy-bible-a-s"
          PKG_DIR="${PKG_NAME}-${VERSION}"

          # Create package directory structure
          mkdir -p "${PKG_DIR}/opt/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps"

          # Copy electron build output
          cp -r dist/linux-unpacked/* "${PKG_DIR}/opt/${PKG_NAME}/"

          # Create launcher script
          cat > "${PKG_DIR}/usr/bin/${PKG_NAME}" << 'LAUNCHER'
          #!/bin/bash
          exec /opt/holy-bible-a-s/holy-bible-a-s "$@"
          LAUNCHER
          chmod +x "${PKG_DIR}/usr/bin/${PKG_NAME}"

          # Create .desktop file
          cat > "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Holy Bible A.S
          Comment=Bible Audio Sync with 60+ translations, TTS, dictionaries
          Exec=/opt/holy-bible-a-s/holy-bible-a-s %U
          Icon=holy-bible-a-s
          Terminal=false
          Type=Application
          Categories=Education;Religion;
          StartupWMClass=holy-bible-a-s
          DESKTOP

          # Copy icon if exists
          if [ -f icon.png ]; then
            cp icon.png "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/${PKG_NAME}.png"
          fi

          # Create .PKGINFO
          cat > "${PKG_DIR}/.PKGINFO" << PKGINFO
          # Generated by Holy Bible A.S GitHub Actions
          pkgname = ${PKG_NAME}
          pkgver = ${VERSION}-1
          pkgdesc = Bible Audio Sync with 60+ translations, TTS, dictionaries, and accessibility features
          url = https://github.com/RufusOliver/Holy-bible-A.S
          arch = x86_64
          license = MIT
          depends = electron
          PKGINFO

          # Create .INSTALL file
          cat > "${PKG_DIR}/.INSTALL" << 'INSTALL'
          post_install() {
            echo "Holy Bible A.S installed to /opt/holy-bible-a-s/"
            echo "Run with: holy-bible-a-s"
            echo "Or find it in your application menu under Education > Religion"
          }
          INSTALL

          # Create tar.zst package
          cd "${PKG_DIR}"
          tar --zstd -cf "../${PKG_NAME}-${VERSION}-x86_64.pkg.tar.zst" .
          cd ..

          echo "Package created: ${PKG_NAME}-${VERSION}-x86_64.pkg.tar.zst"
          ls -lh *.pkg.tar.zst

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            *.pkg.tar.zst
          draft: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win nsis

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.exe
          draft: false

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build DMG
        run: npx electron-builder --mac dmg

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.dmg
          draft: false
