name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Electron for Linux
        run: npx electron-builder --linux dir

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" | sed 's/v//' >> $GITHUB_OUTPUT

      - name: Build native AppImage
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          APP_NAME="holy-bible-a-s"
          DISPLAY_NAME="Holy Bible A.S"

          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

          # Create AppDir structure
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$APPDIR/usr/lib/${APP_NAME}"
          mkdir -p "$APPDIR/opt/${APP_NAME}"

          # Copy electron build
          cp -r dist/linux-unpacked/* "$APPDIR/opt/${APP_NAME}/"

          # Copy data, audio, index.html into opt
          cp index.html "$APPDIR/opt/${APP_NAME}/"
          cp -r data "$APPDIR/opt/${APP_NAME}/"
          if [ -d audio ]; then
            cp -r audio "$APPDIR/opt/${APP_NAME}/"
          fi

          # Create launcher
          cat > "$APPDIR/usr/bin/${APP_NAME}" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "${DIR}/../lib/${APP_NAME}/holy-bible-a-s" "$@"
          EOF
          chmod +x "$APPDIR/usr/bin/${APP_NAME}"

          # Symlink for AppImage
          ln -sf "$APPDIR/usr/bin/${APP_NAME}" "$APPDIR/${APP_NAME}"

          # Desktop file
          cat > "$APPDIR/usr/share/applications/${APP_NAME}.desktop" << 'EOF'
          [Desktop Entry]
          Name=Holy Bible A.S
          GenericName=Bible Audio Sync
          Comment=60+ translations, TTS, dictionaries, accessibility
          Exec=holy-bible-a-s %U
          Icon=holy-bible-a-s
          Terminal=false
          Type=Application
          Categories=Education;Religion;Audio;
          Keywords=bible;audio;sync;kjv;niv;esv;tspeech;
          StartupWMClass=holy-bible-a-s
          MimeType=application/x-holy-bible;
          EOF

          # Symlink desktop file
          ln -sf "$APPDIR/usr/share/applications/${APP_NAME}.desktop" "$APPDIR/${APP_NAME}.desktop"

          # Icon - create from SVG
          cat > "/tmp/icon.svg" << 'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="64" fill="#0a1f0a"/>
            <rect x="224" y="48" width="64" height="416" rx="8" fill="#ffffff"/>
            <rect x="128" y="160" width="256" height="64" rx="8" fill="#ffffff"/>
            <text x="256" y="480" text-anchor="middle" fill="#4caf50" font-family="serif" font-size="36" font-weight="bold">HOLY BIBLE</text>
          </svg>
          SVG

          # Convert SVG to PNG using ImageMagick if available
          if command -v convert &> /dev/null; then
            convert -size 512x512 "/tmp/icon.svg" "$APPDIR/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"
          elif [ -f icon.png ]; then
            cp icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png"
          fi
          ln -sf "$APPDIR/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png" "$APPDIR/${APP_NAME}.png"

          # Build AppImage
          ARCH=x86_64 ./appimagetool "$APPDIR" "${DISPLAY_NAME}-${VERSION}-x86_64.AppImage"

          echo "AppImage built:"
          ls -lh *.AppImage

      - name: Build portable tar.gz
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          tar -czf "Holy-Bible-A.S-${VERSION}-linux-x86_64.tar.gz" -C dist linux-unpacked
          echo "Portable tar.gz built:"
          ls -lh *.tar.gz

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Holy Bible A.S ${{ steps.version.outputs.tag }}"
          body: |
            ## Holy Bible A.S ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Linux AppImage** (recommended): `Holy-Bible-A.S-*.AppImage` — runs on any Linux, integrates with desktop
            - **Linux portable**: `Holy-Bible-A.S-*-linux-x86_64.tar.gz` — extract and run
            - **Arch Linux**: `holy-bible-a-s-*-x86_64.pkg.tar.zst` — native pacman package
            - **Windows**: `Holy-Bible-A.S Setup.exe`
            - **macOS**: `Holy-Bible-A.S.dmg`

            ### Features
            - 60+ Bible translations
            - TTS audiobook with verse highlighting
            - 10 dictionaries: Strong's, Thayer's, BDB, Vine's, Easton's, Smith's, Fausset's, Hitchcock's, JFB, Gill's
            - Interlinear mode with Greek/Hebrew
            - Dyslexia-friendly mode (OpenDyslexic font, reading ruler, backgrounds)
            - Parallel reading (3-way)
            - Bookmarks & storage sync
            - Keyboard shortcuts

            ### Linux AppImage
            ```bash
            chmod +x Holy-Bible-A.S-*.AppImage
            ./Holy-Bible-A.S-*.AppImage
            ```

            ### Linux Portable
            ```bash
            tar -xzf Holy-Bible-A.S-*-linux-x86_64.tar.gz
            cd linux-unpacked
            ./holy-bible-a-s
            ```

            ### Arch Linux
            ```bash
            sudo pacman -U holy-bible-a-s-*-x86_64.pkg.tar.zst
            ```
          files: |
            *.AppImage
            *.tar.gz
          draft: false
          prerelease: false

  build-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git nodejs npm base-devel

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Electron for Linux
        run: npx electron-builder --linux dir

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" | sed 's/v//' >> $GITHUB_OUTPUT

      - name: Create Arch package structure
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          PKG_NAME="holy-bible-a-s"
          PKG_DIR="${PKG_NAME}-${VERSION}"

          # Create package directory structure
          mkdir -p "${PKG_DIR}/opt/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps"

          # Copy electron build output
          cp -r dist/linux-unpacked/* "${PKG_DIR}/opt/${PKG_NAME}/"

          # Create launcher script
          cat > "${PKG_DIR}/usr/bin/${PKG_NAME}" << 'LAUNCHER'
          #!/bin/bash
          exec /opt/holy-bible-a-s/holy-bible-a-s "$@"
          LAUNCHER
          chmod +x "${PKG_DIR}/usr/bin/${PKG_NAME}"

          # Create .desktop file
          cat > "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Holy Bible A.S
          Comment=Bible Audio Sync with 60+ translations, TTS, dictionaries
          Exec=/opt/holy-bible-a-s/holy-bible-a-s %U
          Icon=holy-bible-a-s
          Terminal=false
          Type=Application
          Categories=Education;Religion;
          StartupWMClass=holy-bible-a-s
          DESKTOP

          # Copy icon if exists
          if [ -f icon.png ]; then
            cp icon.png "${PKG_DIR}/usr/share/icons/hicolor/512x512/apps/${PKG_NAME}.png"
          fi

          # Create .PKGINFO
          cat > "${PKG_DIR}/.PKGINFO" << PKGINFO
          # Generated by Holy Bible A.S GitHub Actions
          pkgname = ${PKG_NAME}
          pkgver = ${VERSION}-1
          pkgdesc = Bible Audio Sync with 60+ translations, TTS, dictionaries, and accessibility features
          url = https://github.com/RufusOliver/Holy-bible-A.S
          arch = x86_64
          license = MIT
          depends = electron
          PKGINFO

          # Create .INSTALL file
          cat > "${PKG_DIR}/.INSTALL" << 'INSTALL'
          post_install() {
            echo "Holy Bible A.S installed to /opt/holy-bible-a-s/"
            echo "Run with: holy-bible-a-s"
            echo "Or find it in your application menu under Education > Religion"
          }
          INSTALL

          # Create tar.zst package
          cd "${PKG_DIR}"
          tar --zstd -cf "../${PKG_NAME}-${VERSION}-x86_64.pkg.tar.zst" .
          cd ..

          echo "Package created: ${PKG_NAME}-${VERSION}-x86_64.pkg.tar.zst"
          ls -lh *.pkg.tar.zst

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            *.pkg.tar.zst
          draft: false

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npx electron-builder --win nsis

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.exe
          draft: false

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build DMG
        run: npx electron-builder --mac dmg

      - name: Get version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            dist/*.dmg
          draft: false
