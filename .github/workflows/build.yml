name: Build AppImage

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'audio/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'audio/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare frontend assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R data audio dist/

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri
        run: npx tauri build

      - name: Find AppImage
        id: find
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found"
            ls -R src-tauri/target/release/bundle/
            exit 1
          fi
          echo "path=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "name=$(basename $APPIMAGE)" >> $GITHUB_OUTPUT
          ls -lh "$APPIMAGE"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Bible-A.S-Linux-x86_64
          path: ${{ steps.find.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## AppImage Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`${{ steps.find.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(ls -lh ${{ steps.find.outputs.path }} | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from [Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  build-deb-rpm:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare frontend assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R data audio dist/

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri
        run: npx tauri build

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Bible-A.S-Debian
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Bible-A.S-Fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare frontend assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R data audio dist/

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri
        run: npx tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Bible-A.S-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare frontend assets
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -R data audio dist/

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri
        run: npx tauri build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Holy-Bible-A.S-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
