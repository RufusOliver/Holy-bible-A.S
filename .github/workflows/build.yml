name: Build Native Linux AppImage

"on":
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'audio/**'
      - 'native-linux/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'audio/**'
      - 'native-linux/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            gcc \
            pkg-config \
            file

      - name: Build native AppImage
        run: bash native-linux/build-appimage.sh

      - name: Find AppImage
        id: find
        run: |
          APPIMAGE=$(find build -maxdepth 1 -name "*.AppImage" | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No AppImage found"
            ls -R build/
            exit 1
          fi
          echo "path=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Holy-Bible-A.S-Linux-x86_64
          path: ${{ steps.find.outputs.path }}
          retention-days: 30
          if-no-files-found: error
